/* Layout: a régie console. The live map is the stage, the control panel sits beside it;
   the player side is one phone-width column. Identity: Paris street-plaque enamel,
   zinc roofs, Wallace-fountain green, lantern amber for alerts. */
:root{
  --bg:#E4E8EB; --paper:#F8F9FA; --paper-2:#EEF1F3; --ink:#15202B; --ink-2:#56626F; --line:#CDD4DA;
  --accent:#1D3B78; --accent-ink:#FFFFFF; --accent-soft:#DDE5F4;
  --plaque:#1D3B78; --plaque-ink:#FFFFFF; --plaque-frame:#2C5A4B;
  --ok:#1C6A4F; --ok-soft:#DBEFE5; --warn:#A86400; --warn-soft:#FBEACF; --bad:#B3261E; --bad-soft:#F8DEDB;
  --land:#F5F7F8; --outside:#D3D9DE; --water:#A6C6DF; --arr-line:#B7C1CA; --arr-label:#AAB4BD; --map-label:#66727E;
  --shadow:0 1px 2px rgba(21,32,43,.08),0 8px 22px rgba(21,32,43,.10);
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --paper:#141C25; --paper-2:#1A2430; --ink:#E4E9EE; --ink-2:#98A4B0; --line:#283340;
    --accent:#7FA2EC; --accent-ink:#0C1218; --accent-soft:#1C2A45;
    --plaque:#22478F; --plaque-ink:#FFFFFF; --plaque-frame:#3A7160;
    --ok:#52C095; --ok-soft:#14302A; --warn:#F2A541; --warn-soft:#382811; --bad:#F27D72; --bad-soft:#3A1B19;
    --land:#18212B; --outside:#0E141A; --water:#1C4564; --arr-line:#2C3A48; --arr-label:#33414F; --map-label:#7C8996;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.40);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --paper:#141C25; --paper-2:#1A2430; --ink:#E4E9EE; --ink-2:#98A4B0; --line:#283340;
  --accent:#7FA2EC; --accent-ink:#0C1218; --accent-soft:#1C2A45;
  --plaque:#22478F; --plaque-ink:#FFFFFF; --plaque-frame:#3A7160;
  --ok:#52C095; --ok-soft:#14302A; --warn:#F2A541; --warn-soft:#382811; --bad:#F27D72; --bad-soft:#3A1B19;
  --land:#18212B; --outside:#0E141A; --water:#1C4564; --arr-line:#2C3A48; --arr-label:#33414F; --map-label:#7C8996;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.40);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{display:inline-flex;align-items:center;gap:7px;font:500 13px/1 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live.off{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}

/* Street plaque */
.plaque{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--plaque);color:var(--plaque-ink);
  border:3px solid var(--plaque-frame);border-radius:8px;
  box-shadow:inset 0 0 0 2px var(--plaque),inset 0 0 0 3.5px var(--plaque-ink);
  padding:7px 16px 8px;text-align:center;line-height:1;max-width:100%;
}
.plaque small{font:700 10.5px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.plaque b{font:800 22px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere}
.plaque--sm{padding:5px 12px 6px}
.plaque--sm b{font-size:16px}
.plaque--sm small{font-size:9px}
.plaque--lg b{font-size:clamp(24px,7vw,32px)}

.switch{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:650;cursor:pointer;color:var(--ink-2)}
.switch button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}

/* Buttons, pills, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:650;cursor:pointer;min-height:40px;text-align:center}
.btn:hover{background:var(--paper-2)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn--ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn--ok:hover{background:var(--ok);filter:brightness(1.08)}
.btn--danger{color:var(--bad);border-color:var(--bad)}
.btn--sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn--ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:4px;font:650 11.5px/1 var(--f-body);padding:4px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill--ok{background:var(--ok-soft);color:var(--ok)}
.pill--warn{background:var(--warn-soft);color:var(--warn)}
.pill--bad{background:var(--bad-soft);color:var(--bad)}
.pill--info{background:var(--accent-soft);color:var(--accent)}

.field{display:grid;gap:5px;min-width:0}
.field > label,.label{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;min-height:42px}
textarea.input{resize:vertical;min-height:76px;line-height:1.4}
.input:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}

/* Map frame */
.map-frame{position:relative;isolation:isolate;z-index:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--outside);min-height:0}
.map{position:absolute;inset:0}
.leaflet-container{background:var(--outside);font-family:var(--f-body)}
.leaflet-control-attribution{background:var(--paper)!important;color:var(--ink-2);font-size:10px;padding:1px 6px;border-radius:6px 0 0 0;opacity:.85}
.leaflet-control-attribution a{color:var(--ink-2)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-bar a{background:var(--paper)!important;color:var(--ink)!important;border-bottom-color:var(--line)!important}
.map-overlay{position:absolute;left:10px;top:10px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.map-overlay > *{pointer-events:auto}
.map-note{background:var(--paper);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
.map-note--accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.map-error{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--ink-2)}

.pgj-icon{background:none!important;border:0!important}
.tm{position:relative;width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font:800 12px/1 var(--f-display);cursor:pointer}
.tm-lbl{position:absolute;left:26px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--paper);color:var(--ink);font:650 11.5px/1 var(--f-body);padding:4px 6px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.22);pointer-events:none}
.map.z-lo .tm-lbl{display:none}
.tm.sel .tm-lbl{display:block!important;background:var(--ink);color:var(--bg)}
.tm.alert::before,.tm.me::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--warn);animation:ping 1.6s ease-out infinite}
.tm.me::before{border-color:var(--c)}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.stm{width:24px;height:24px;background:var(--plaque);color:#fff;border:2px solid var(--plaque-frame);border-radius:5px;display:grid;place-items:center;font:800 13px/1 var(--f-display);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
.stm.done{background:var(--ok);border-color:var(--ok)}
.stm.start{background:var(--ink);border-color:var(--ink);color:var(--bg);border-radius:50%}
.mon{display:flex;align-items:center;gap:4px;white-space:nowrap;font:650 11px/1 var(--f-body);color:var(--map-label);pointer-events:none;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.mon i{width:6px;height:6px;border-radius:50%;background:var(--map-label);flex:none}
.mon--parc i{background:var(--ok)}
.mon--gare i{border-radius:1px}
.map.z-lo .mon span{display:none}
.arr-lbl{display:grid;place-items:center;font:800 22px/1 var(--f-display);color:var(--arr-label);pointer-events:none;letter-spacing:.02em}
.map.z-hi .arr-lbl{display:none}
.map.tiles .mon{display:none}
.map.tiles .arr-lbl{color:var(--plaque);opacity:.4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)} }
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}

/* Régie */
.view-regie{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:12px}
.panel{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-height:0;overflow:hidden;position:relative}
.panel-head{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap}
.stat{display:grid;gap:2px}
.stat b{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.stat.warn b{color:var(--warn)}
.simbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:5px 9px;font:500 12.5px/1 var(--f-mono);cursor:pointer;color:var(--ink-2);min-height:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;background:none;padding:10px;font-weight:650;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font:500 11px/1 var(--f-mono);background:var(--paper-2);border-radius:999px;padding:3px 6px;color:var(--ink-2)}
.count--warn{background:var(--warn-soft);color:var(--warn)}
.panel-body{flex:1;min-height:0;overflow:auto}
.demo-note{margin:12px 16px 4px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);display:grid;gap:8px;font-size:13.5px}
.demo-note b{font-weight:700}

.team-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:5px 10px;align-items:center;width:100%;text-align:left;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.team-row:hover{background:var(--paper-2)}
.dot{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 14px/1 var(--f-display);flex:none}
.team-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-meta{grid-column:2/4;display:flex;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.score{font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score small{font-size:11px;color:var(--ink-2)}
.prog{display:inline-flex;gap:2px}
.prog i{width:11px;height:5px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--ok)}
.prog i.cur{background:var(--accent)}

.feed-tools{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.feed-item{display:grid;grid-template-columns:40px 10px minmax(0,1fr);gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}
.feed-time{font:500 12px/1.5 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.feed-dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-2));margin-top:5px}
.feed-text{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;min-width:0}
.feed-text span{min-width:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;color:var(--ink-2);text-align:center;font-size:14px}

.step-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.step-row:hover{background:var(--paper-2)}
.step-num{width:28px;height:28px;background:var(--plaque);color:#fff;border:2px solid var(--plaque-frame);border-radius:5px;display:grid;place-items:center;font:800 15px/1 var(--f-display)}
.step-meta{grid-column:2/4;font-size:12.5px;color:var(--ink-2);display:flex;gap:6px 10px;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.section{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.section h3{font:800 15px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.msg-hist{display:grid;gap:8px}
.msg-hist div{font-size:13.5px;padding:9px 12px;background:var(--paper-2);border-radius:8px;display:grid;gap:3px}
.msg-hist time{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.templates{display:flex;gap:6px;flex-wrap:wrap}
.templates button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.templates button:hover{background:var(--paper-2)}

.sheet{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:10}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-head .grow{flex:1;min-width:0}
.sheet-head h2{font:800 22px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head p{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.sheet-body{flex:1;overflow:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--paper-2);border-radius:8px;padding:9px 11px;display:grid;gap:3px;min-width:0}
.kv span{font-size:11.5px;color:var(--ink-2);font-weight:650}
.kv b{font-weight:700;overflow-wrap:anywhere}
.qr-card{background:#fff;border-radius:10px;padding:14px;justify-self:center;display:grid;place-items:center;border:1px solid var(--line)}
.qr-card img,.qr-card canvas{display:block;max-width:100%;height:auto}
.url-box{display:flex;gap:6px;align-items:center}
.url-box code{flex:1;min-width:0;font:12px/1.4 var(--f-mono);background:var(--paper-2);padding:8px 10px;border-radius:6px;overflow-wrap:anywhere;user-select:all}
.ai-box{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13px;background:var(--accent-soft)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--bad-soft);border-radius:8px;font-size:13.5px}

/* Joueur */
.view-joueur{display:flex;justify-content:center}
.phone{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;gap:10px;position:relative}
.phone > .map-frame{flex:0 0 36%;min-height:190px}
.p-status{display:flex;align-items:center;gap:10px;min-height:40px;flex:none}
.p-status .grow{flex:1;min-width:0}
.p-status .team-name{font-size:15px}
.p-status .sub{font-size:12px;color:var(--ink-2);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.p-score{display:grid;justify-items:end;gap:2px}
.p-score b{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.p-score span{font-size:11px;color:var(--ink-2);font-weight:650}
.p-scroll{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding-bottom:76px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card > .plaque{justify-self:start}
.card p{max-width:62ch}
.lead{font-size:15.5px}
.quote{font-size:16px;line-height:1.5}
.eyebrow{font:800 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.status-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.compass{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
.answer-row{display:flex;gap:8px}
.answer-row .input{flex:1;min-width:0}
.hints{display:grid;gap:8px}
.hint-item{font-size:14px;padding:9px 12px;border-radius:8px;background:var(--warn-soft);display:grid;gap:2px}
.hint-item span{font-size:11.5px;font-weight:700;color:var(--warn)}
.feedback{font-size:13.5px;font-weight:650}
.feedback.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.notice{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.notice header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.notice header b{font:800 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.notice time{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.notice .x{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:13px;padding:2px 4px}
.trail-plaques{display:flex;gap:6px;flex-wrap:wrap}
.trail-plaques .step-num{width:30px;height:30px;font-size:15px}
.trail-plaques .step-num.done{background:var(--ok);border-color:var(--ok)}
.trail-plaques .step-num.todo{background:var(--paper-2);color:var(--ink-2);border-color:var(--line)}
.mj-fab{position:absolute;right:0;bottom:8px;z-index:15;box-shadow:var(--shadow);border-radius:999px;padding-inline:18px}
.chat{position:absolute;left:0;right:0;bottom:0;height:min(78%,560px);background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-log{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:grid;gap:10px;align-content:start}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg--team{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg--mj{justify-self:start;background:var(--paper-2);border-bottom-left-radius:4px}
.msg--sys{justify-self:center;background:var(--warn-soft);font-size:13px}
.msg.pending{color:var(--ink-2);font-style:italic}
.chat-suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chat-form{display:flex;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line)}
.chat-form .input{flex:1;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:14px;z-index:1000;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

@media (max-width:860px){
  .view-regie{grid-template-columns:1fr;grid-template-rows:minmax(200px,40%) minmax(0,1fr)}
}
@media (max-width:520px){
  .switch button{padding:6px 11px}
  .stat b{font-size:22px}
  .clock .t-plus{display:none}
}
@media (prefers-reduced-motion:reduce){
  .tm.alert::before,.tm.me::before{animation:none;opacity:.8;transform:scale(1.1)}
  .shake{animation:none}
}

<div class="app">
  <header class="topbar">
    <div class="plaque plaque--sm" aria-label="Paris Grand Jeu, démo"><small>Démo · Paris</small><b>Grand Jeu</b></div>
    <div class="switch" role="tablist" aria-label="Vue">
      <button id="v-joueur" role="tab" aria-selected="false" data-view="joueur">Joueur</button>
      <button id="v-regie" role="tab" aria-selected="true" data-view="regie">Régie</button>
    </div>
    <div class="topbar-right">
      <span class="clock"><span class="live" id="live-dot"></span><span id="clock">--:--</span><span class="t-plus" id="tplus"></span></span>
    </div>
  </header>

  <main>
    <section class="view view-regie" id="view-regie" aria-label="Régie">
      <div class="map-frame">
        <div class="map" id="map-regie"></div>
        <div class="map-overlay" id="regie-overlay"></div>
      </div>
      <aside class="panel" id="panel">
        <div class="panel-head">
          <div class="stats" id="stats"></div>
          <div class="simbar">
            <span class="hint">Simulation</span>
            <div class="seg" id="speed" role="group" aria-label="Vitesse de simulation">
              <button data-speed="1" aria-pressed="false">×1</button>
              <button data-speed="10" aria-pressed="true">×10</button>
              <button data-speed="30" aria-pressed="false">×30</button>
            </div>
            <button class="btn btn--sm" id="pause">Pause</button>
            <button class="btn btn--sm btn--primary" id="qr-open">QR d'inscription</button>
          </div>
        </div>
        <nav class="tabs" role="tablist" aria-label="Régie">
          <button role="tab" data-tab="equipes" aria-selected="true">Équipes <span class="count" id="c-teams">0</span></button>
          <button role="tab" data-tab="fil" aria-selected="false">Fil <span class="count" id="c-feed">0</span></button>
          <button role="tab" data-tab="parcours" aria-selected="false">Parcours</button>
          <button role="tab" data-tab="diffusion" aria-selected="false">Diffusion</button>
        </nav>
        <div class="panel-body" id="tab-equipes"></div>
        <div class="panel-body" id="tab-fil" hidden></div>
        <div class="panel-body" id="tab-parcours" hidden></div>
        <div class="panel-body" id="tab-diffusion" hidden></div>
        <div class="sheet" id="sheet" hidden></div>
      </aside>
    </section>

    <section class="view view-joueur" id="view-joueur" aria-label="Joueur" hidden>
      <div class="phone">
        <div class="p-status" id="p-status"></div>
        <div class="map-frame">
          <div class="map" id="map-joueur"></div>
          <div class="map-overlay" id="joueur-overlay"></div>
        </div>
        <div class="p-scroll" id="p-scroll"></div>
        <button class="btn btn--primary mj-fab" id="mj-open" hidden>Maître du jeu</button>
        <div class="chat" id="chat" hidden>
          <div class="sheet-head">
            <div class="grow"><h2>Maître du jeu</h2><p id="chat-sub">IA · connaît votre étape, jamais la réponse</p></div>
            <button class="btn btn--sm" id="chat-close">Fermer</button>
          </div>
          <div class="chat-log" id="chat-log" aria-live="polite"></div>
          <div class="chat-suggest" id="chat-suggest"></div>
          <form class="chat-form" id="chat-form">
            <input class="input" id="chat-input" autocomplete="off" maxlength="300" placeholder="Votre question…" aria-label="Question au Maître du jeu">
            <button class="btn btn--primary" id="chat-send" type="submit">Envoyer</button>
          </form>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toRad = Math.PI / 180;
function dist(a, b){
  const dLat = (b[0]-a[0])*toRad, dLng = (b[1]-a[1])*toRad;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*toRad)*Math.cos(b[0]*toRad)*Math.sin(dLng/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(x));
}
function bearingFR(a, b){
  const y = (b[1]-a[1])*Math.cos(a[0]*toRad), x = b[0]-a[0];
  const deg = (Math.atan2(y, x)/toRad + 360) % 360;
  return ["nord","nord-est","est","sud-est","sud","sud-ouest","ouest","nord-ouest"][Math.round(deg/45) % 8];
}
function clock(t){ const s = Math.floor(T0 + t); return String(Math.floor(s/3600)%24).padStart(2,"0") + ":" + String(Math.floor(s%3600/60)).padStart(2,"0"); }
function ago(sec){ const m = Math.floor(Math.max(0, sec)/60); return m < 1 ? "à l'instant" : "il y a " + m + " min"; }
function fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(1).replace(".", ",") + " km" : (Math.round(m/10)*10) + " m"; }
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function isRight(input, keys){
  const n = norm(input); if (!n) return false;
  const padded = " " + n + " ";
  return keys.some(k => { const kk = norm(k); return kk && padded.includes(" " + kk + " "); });
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function ordinal(n){ return n === 1 ? "1er" : n + "e"; }
function initial(tm){ const n = tm.name.replace(/^(les|la|le|l')\s*/i, "").trim(); return (n[0] || "?").toUpperCase(); }

function legInfo(i){
  if (legCache.has(i)) return legCache.get(i);
  const st = S.steps[i];
  const prev = i === 0 ? [START.lat, START.lng] : [S.steps[i-1].lat, S.steps[i-1].lng];
  const pts = [prev].concat(st.leg || [], [[st.lat, st.lng]]);
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k-1] + dist(pts[k-1], pts[k]));
  const info = { pts, cum, total: cum[cum.length-1] };
  legCache.set(i, info);
  return info;
}
function along(info, d){
  if (d <= 0) return info.pts[0].slice();
  if (d >= info.total) return info.pts[info.pts.length-1].slice();
  let k = 1; while (info.cum[k] < d) k++;
  const f = (d - info.cum[k-1]) / ((info.cum[k] - info.cum[k-1]) || 1);
  const a = info.pts[k-1], b = info.pts[k];
  return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f];
}
function stepsChanged(){ legCache = new Map(); drawStepMarkers(); drawPlayerMap(); renderParcours(); renderPlayer(); save(); }

function makeSim(cfg, i){
  return { id:cfg.id, name:cfg.name, color:COLORS[i], members:cfg.members, sim:true, cfg,
    off:[(i-2)*0.00005, ((i*3)%5-2)*0.00006],
    pos:[START.lat, START.lng], trail:[[START.lat, START.lng]], lastTrailT:0,
    step:0, phase:"attente", legProg:0, solveLeft:0, pending:[], arrivedT:0,
    score:0, hintsTaken:0, wrongs:0, lastActT:0, alerted:false, msgs:[], chat:[], revealed:{} };
}

function feed(tm, kind, text){
  S.feed.unshift({ id:++S.seq, t:S.t, team: tm ? tm.id : null, kind, text });
  if (S.feed.length > 400) S.feed.length = 400;
  if (tm) tm.lastActT = S.t;
  dirty.lists = true;
}

/* ---------- Simulation ---------- */
function simStep(tm, dt){
  if (tm.phase === "done") return;
  if (tm.phase === "attente"){
    if (S.t < tm.cfg.startAt) return;
    tm.phase = "walk"; tm.legProg = 0;
    feed(tm, "start", tm.name + " a pris le départ");
  }
  if (tm.step >= S.steps.length){ finish(tm); return; }
  if (tm.phase === "walk"){
    const L = legInfo(tm.step);
    tm.legProg += tm.cfg.speed * dt;
    const p = along(L, tm.legProg);
    tm.pos = [p[0] + tm.off[0], p[1] + tm.off[1]];
    if (S.t - tm.lastTrailT >= 20){ tm.trail.push(tm.pos.slice()); tm.lastTrailT = S.t; }
    if (tm.legProg >= L.total) arrive(tm);
  } else if (tm.phase === "onsite"){
    tm.solveLeft -= dt;
    while (tm.pending.length && tm.pending[0].at <= S.t) fireSim(tm, tm.pending.shift());
    if (tm.solveLeft <= 0) validate(tm, "sim");
  }
}
function arrive(tm){
  const st = S.steps[tm.step];
  tm.phase = "onsite"; tm.arrivedT = S.t; tm.alerted = false;
  feed(tm, "arrive", tm.name + " est sur place : " + st.nom);
  if (tm.sim){
    const c = tm.cfg, k = tm.step, solve = c.solve[k] != null ? c.solve[k] : 240;
    const r = rng(hash(tm.id) + k * 101);
    tm.solveLeft = solve; tm.pending = [];
    if ((c.ask || [])[k]) tm.pending.push({ at:S.t + solve*(0.15 + 0.1*r()), kind:"ask" });
    for (let w = 0; w < ((c.wrong || [])[k] || 0); w++) tm.pending.push({ at:S.t + solve*(0.25 + 0.3*r()), kind:"wrong", w });
    for (let h = 0; h < ((c.hints || [])[k] || 0); h++) tm.pending.push({ at:S.t + solve*(0.45 + 0.15*h + 0.1*r()), kind:"hint", h });
    tm.pending.sort((a, b) => a.at - b.at);
  }
}
function fireSim(tm, ev){
  const st = S.steps[tm.step]; if (!st) return;
  if (ev.kind === "hint"){
    const ind = st.indices[Math.min(ev.h, st.indices.length - 1)]; if (!ind) return;
    tm.score -= ind.c; tm.hintsTaken++;
    feed(tm, "hint", tm.name + " a pris un indice sur « " + st.nom + " » · −" + ind.c + " pts");
  } else if (ev.kind === "wrong"){
    const list = WRONG[st.id] || ["…"];
    tm.wrongs++;
    feed(tm, "wrong", tm.name + " a répondu « " + list[ev.w % list.length] + " » : refusé");
  } else if (ev.kind === "ask"){
    const q = ASKS[st.id]; if (!q) return;
    tm.chat.push({ who:"team", text:q, t:S.t });
    feed(tm, "ask", tm.name + " → Maître du jeu : « " + q + " »");
  }
}
function validate(tm, how){
  const st = S.steps[tm.step]; if (!st) return;
  tm.score += st.points; tm.pending = []; tm.alerted = false;
  feed(tm, "valid", tm.name + " a validé « " + st.nom + " »" + (how === "mj" ? " (validée par la régie)" : "") + " · +" + st.points + " pts");
  tm.step++; tm.legProg = 0; tm.arrivedT = 0;
  if (tm.step >= S.steps.length) finish(tm); else tm.phase = "walk";
  if (tm.id === S.meId){ drawPlayerMap(); renderPlayer(); focusPlayer(); save(); }
}
function finish(tm){
  if (tm.phase === "done") return;
  tm.phase = "done"; tm.doneT = S.t;
  feed(tm, "done", tm.name + " a terminé le parcours · " + tm.score + " pts");
}
function isBlocked(tm){ return tm.phase === "onsite" && S.t - tm.arrivedT >= 600; }
function checkAlerts(tm){
  if (isBlocked(tm) && !tm.alerted){
    tm.alerted = true;
    feed(tm, "alert", tm.name + " bloque sur « " + S.steps[tm.step].nom + " » depuis 10 min");
  }
}
function advance(dt){
  while (dt > 0){
    const d = Math.min(dt, 1);
    S.t += d;
    for (const tm of S.teams){ if (tm.sim) simStep(tm, d); checkAlerts(tm); }
    dt -= d;
  }
}
function ranking(){
  return S.teams.slice().sort((a, b) => (b.step - a.step) || (b.score - a.score) || ((a.doneT || 1e9) - (b.doneT || 1e9)));
}
function teamStatus(tm){
  if (tm.phase === "attente") return { txt:"Départ à " + clock(tm.cfg.startAt), cls:"" };
  if (tm.phase === "done") return { txt:"Terminé", cls:"ok" };
  if (isBlocked(tm)) return { txt:"Bloquée " + Math.floor((S.t - tm.arrivedT)/60) + " min", cls:"warn" };
  if (tm.phase === "onsite") return { txt:"Sur place", cls:"info" };
  return { txt:"En route", cls:"" };
}

const maps = [];
function mpp(z){ return 156543.03392 * Math.cos(48.8566 * toRad) / Math.pow(2, z); }
function baseMap(elId, opts){
  const map = L.map(elId, { zoomControl:false, minZoom:12, maxZoom:18, zoomSnap:0.5, zoomDelta:0.5,
    maxBounds:[[48.79,2.18],[48.93,2.51]], maxBoundsViscosity:0.8 });
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution(HOSTED ? ATTR_OSM : ATTR_SIMPLE);
  L.control.zoom({ position:"bottomright", zoomInTitle:"Zoomer", zoomOutTitle:"Dézoomer" }).addTo(map);
  const polys = MAP.arr.map(a => L.polygon(a[2], { interactive:false, weight:1 }).addTo(map));
  const seine = MAP.seine.map(s => ({ w:s.w, line:L.polyline(s.p, { interactive:false, lineCap:"round", lineJoin:"round" }).addTo(map) }));
  MAP.arr.forEach(a => L.marker(a[3], { interactive:false, keyboard:false,
    icon:L.divIcon({ className:"pgj-icon arr-lbl", html:"<span>" + ordinal(a[0]) + "</span>", iconSize:[44,24], iconAnchor:[22,12] }) }).addTo(map));
  MONUMENTS.forEach(m => {
    if (opts.hideNearSteps && S.steps.some(st => dist([st.lat, st.lng], [m[1], m[2]]) < 200)) return;
    L.marker([m[1], m[2]], { interactive:false, keyboard:false,
      icon:L.divIcon({ className:"pgj-icon", html:'<div class="mon mon--' + (m[3] || "mon") + '"><i></i><span>' + esc(m[0]) + "</span></div>", iconSize:[0,0], iconAnchor:[3,3] }) }).addTo(map);
  });
  map.setView(opts.center, opts.zoom);
  const ctx = { map, polys, seine, tiles:false };
  if (HOSTED){
    ctx.tiles = true; map.getContainer().classList.add("tiles");
    let ok = 0, bad = 0;
    const layer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19 });
    layer.on("tileload", () => { ok++; });
    layer.on("tileerror", () => {
      bad++;
      if (!ok && bad >= 6 && ctx.tiles){
        ctx.tiles = false; layer.remove(); map.getContainer().classList.remove("tiles");
        map.attributionControl.removeAttribution(ATTR_OSM); map.attributionControl.addAttribution(ATTR_SIMPLE);
        styleBase(ctx);
      }
    });
    layer.addTo(map);
  }
  const onZoom = () => {
    const z = map.getZoom(), c = map.getContainer();
    c.classList.toggle("z-lo", z < 14);
    c.classList.toggle("z-hi", z >= 15.5);
    seine.forEach(s => s.line.setStyle({ weight: Math.max(2, s.w / mpp(z)) }));
  };
  map.on("zoomend", onZoom);
  styleBase(ctx); onZoom();
  maps.push(ctx);
  return ctx;
}
function styleBase(ctx){
  if (ctx.tiles){
    const pl = cssVar("--plaque");
    ctx.polys.forEach(p => p.setStyle({ color:pl, weight:1.5, opacity:.45, dashArray:"5 6", fillOpacity:0 }));
    ctx.seine.forEach(s => s.line.setStyle({ opacity:0 }));
    return;
  }
  const land = cssVar("--land"), line = cssVar("--arr-line"), water = cssVar("--water");
  ctx.polys.forEach(p => p.setStyle({ color:line, weight:1, opacity:1, dashArray:null, fillColor:land, fillOpacity:1 }));
  ctx.seine.forEach(s => s.line.setStyle({ color:water, opacity:1 }));
}

function updateMarkers(){

  const st = S.steps[me.step];
  if (!st || me.phase !== "walk"){ player.ctx.map.setView(me.pos, Math.max(player.ctx.map.getZoom(), 16)); return; }
  const z = zoneOf(st), dLat = z.r/111320, dLng = z.r/(111320*Math.cos(z.c[0]*toRad));
  const b = L.latLngBounds([me.pos, [z.c[0]-dLat, z.c[1]-dLng], [z.c[0]+dLat, z.c[1]+dLng]]);
  player.ctx.map.fitBounds(b, { padding:[28,28], maxZoom:16.5 });
}
function zoneOf(st){
  const h = hash(st.id + st.lat.toFixed(4));
  const ang = (h % 360) * toRad, off = 40 + (h % 45);
  return { c:[st.lat + off*Math.cos(ang)/111320, st.lng + off*Math.sin(ang)/(111320*Math.cos(st.lat*toRad))], r:170 };
}

    else { const z = zoneOf(st); L.circle(z.c, { radius:z.r, color:acc, weight:2, dashArray:"6 6", fillColor:acc, fillOpacity:.08, interactive:false }).addTo(player.lg); }

function renderOverlay(){

/* ---------- Joueur : position et progression ---------- */
function setMyPos(p){
  const me = myTeam(); if (!me) return;
  me.pos = p;
  if (S.t - me.lastTrailT > 5){ me.trail.push(p.slice()); me.lastTrailT = S.t; }
  me.lastActT = S.t;
  checkMyArrival();
  updateMarkers(); renderPlayerLive();
}
function checkMyArrival(){
  const me = myTeam(); if (!me || me.phase !== "walk") return;
  const st = S.steps[me.step]; if (!st) return;
  if (dist(me.pos, [st.lat, st.lng]) <= st.rayon){
    arrive(me);
    toast("Vous êtes arrivés. L'énigme est débloquée.");
    drawPlayerMap(); renderPlayer(); save();
  }
}
let gpsWatch = null;
function toggleGPS(){
  if (!CAN_GPS) return;
  if (gpsWatch !== null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; ui.gps = "off"; renderOverlay(); renderPlayer(); return; }
  ui.gps = "pending"; renderOverlay(); renderPlayer();
  gpsWatch = navigator.geolocation.watchPosition(pos => {
    const p = [pos.coords.latitude, pos.coords.longitude];
    ui.gpsAcc = Math.round(pos.coords.accuracy);
    const first = ui.gps !== "on"; ui.gps = "on";
    const me = myTeam();
    if (me && !S.paused && me.phase !== "done" && (first || dist(me.pos, p) > 4)){
      setMyPos(p);
      if (player.ctx && !player.ctx.map.getBounds().contains(p)) player.ctx.map.panTo(p);
    }
    renderOverlay();
    if (first){ renderPlayer(); toast("GPS activé."); }
  }, err => {
    if (err.code === 1){
      if (gpsWatch !== null) navigator.geolocation.clearWatch(gpsWatch);
      gpsWatch = null; ui.gps = "denied"; renderOverlay(); renderPlayer();
      toast("Localisation refusée. Autorisez-la dans les réglages du navigateur.");
    } else if (ui.gps !== "on" && !ui.gpsWarned){
      ui.gpsWarned = true;
      toast("Signal GPS faible : la recherche continue. Sortez à découvert si possible.");
    }
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:30000 });
}
function simulateArrival(){
  const me = myTeam(); if (!me) return;
  const st = S.steps[me.step]; if (!st) return;
  if (player.anim) cancelAnimationFrame(player.anim);
  const from = me.pos.slice(), to = [st.lat, st.lng], t0 = performance.now(), dur = 2200;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = now => {
    const f = reduce ? 1 : Math.min(1, (now - t0)/dur), e = f < .5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2)/2;
    me.pos = [from[0] + (to[0]-from[0])*e, from[1] + (to[1]-from[1])*e];
    updateMarkers();
    if (player.ctx) player.ctx.map.panTo(me.pos, { animate:false });
    if (f < 1) player.anim = requestAnimationFrame(step);
    else { player.anim = null; me.trail.push(to.slice()); setMyPos(to); }
  };
  player.anim = requestAnimationFrame(step);
}
function register(name, colorIdx, members){
  const me = { id:"moi", name, color:COLORS[colorIdx], members, sim:false,
    pos:[START.lat, START.lng], trail:[[START.lat, START.lng]], lastTrailT:S.t,
    step:0, phase:"walk", score:0, hintsTaken:0, wrongs:0, lastActT:S.t, alerted:false, arrivedT:0,
    msgs:[], chat:[], revealed:{}, joinedT:S.t };
  S.teams.push(me); S.meId = me.id;
  feed(me, "join", me.name + " s'est inscrite" + (members.length ? " (" + members.length + " joueurs)" : ""));
  if (player.meMk){ player.meMk.remove(); player.meMk = null; }
  updateMarkers(); drawPlayerMap(); renderPlayer(); renderLive(true); focusPlayer(); save();
  toast("Équipe inscrite. Première destination débloquée.");
  if (ui.pendingBalise){ const b = ui.pendingBalise; ui.pendingBalise = null; handleBalise(b); }
}
function submitAnswer(){
  const me = myTeam(); const st = me && S.steps[me.step]; if (!st || me.phase !== "onsite") return;
  const inp = $("answer"), fb = $("answer-fb"), v = inp.value.trim();
  if (!v) return;
  if (isRight(v, st.reponses)){
    const pts = st.points;
    validate(me, "player");
    toast("Bonne réponse ! +" + pts + " points");
  } else {
    me.wrongs++;
    feed(me, "wrong", me.name + " a répondu « " + v + " » : refusé");
    fb.textContent = "Pas tout à fait. Relisez l'énigme, observez autour de vous, ou prenez un indice.";
    fb.className = "feedback bad";
    inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    inp.select();
    save();
  }
}
function takeHint(){
  const me = myTeam(); const st = me && S.steps[me.step]; if (!st) return;
  const n = me.revealed[st.id] || 0; const ind = st.indices[n]; if (!ind) return;
  me.revealed[st.id] = n + 1; me.score -= ind.c; me.hintsTaken++;

}
function handleBalise(code){
  const idx = S.steps.findIndex(s => s.balise === code);
  if (idx < 0){ toast("Balise inconnue."); return; }
  const me = myTeam();
  if (!me){ ui.pendingBalise = code; toast("Inscrivez d'abord votre équipe : la balise sera prise en compte ensuite."); return; }
  if (idx !== me.step){ toast(idx < me.step ? "Étape déjà validée." : "Cette balise correspond à une autre étape."); return; }
  if (me.phase === "onsite"){ toast("Énigme déjà débloquée."); return; }
  feed(me, "arrive", me.name + " a scanné la balise de « " + S.steps[idx].nom + " »");
  setMyPos([S.steps[idx].lat, S.steps[idx].lng]);
}

/* ---------- Maître du jeu (IA) ---------- */
let samplePromise = Promise.resolve(null);
try { if (window.claude && typeof window.claude.use === "function") samplePromise = window.claude.use("sample").catch(() => null); } catch (e) {}
let chatCtl = null, chatBusy = false;
const PERMANENT = new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"]);
function errCopy(code){
  if (PERMANENT.has(code)) return "Le Maître du jeu IA n'est pas disponible dans cette vue. Prenez un indice ou appelez l'organisateur.";
  if (code === "rate_limited") return "Trop de questions d'un coup. Réessayez dans un moment.";
  if (code === "session_expired") return "Reconnectez-vous à Claude pour parler au Maître du jeu.";
  if (code === "refused") return "Le Maître du jeu ne peut pas répondre à ça. Reformulez votre question.";
  return "La connexion a coupé. Réessayez.";
}
function buildPrompt(me, q, history){
  const N = S.steps.length, st = S.steps[me.step], L = [];
  L.push("Tu es « le Maître du jeu », l'animateur d'un grand jeu de piste à pied dans Paris. Tu écris à une équipe de joueurs, sur leur téléphone, pendant la partie.");
  L.push("", "Règles :",
    "- Réponds en français, en 2 à 4 phrases courtes, sur un ton complice et encourageant. Tutoie l'équipe.",
    "- Ne donne jamais la réponse de l'énigme, ni une partie de la réponse (lettres, syllabes, nombre de lettres, rime), ni une reformulation qui la rende évidente. Si l'équipe insiste, propose-lui de prendre un indice dans l'appli : il coûte des points.",
    "- Pour l'itinéraire, aide à s'orienter (direction, rues, repères visibles). Ne nomme le lieu exact que si l'équipe est à moins de 300 m et vraiment perdue.",
    "- Pour une question pratique (métro, toilettes, sécurité), réponds au mieux et dis-le si tu n'es pas sûr. En cas d'urgence : appeler le 112 et prévenir l'organisateur.",
    "- Si la question n'a rien à voir avec le jeu, ramène l'équipe au jeu avec humour.");
  L.push("", "Équipe : " + me.name + ". Score : " + me.score + " points.");
  if (!st){
    L.push("L'équipe a terminé le parcours. Félicite-la et invite-la à rejoindre le point d'arrivée.");
  } else {
    L.push("Étape " + (me.step + 1) + " sur " + N + ".");
    if (me.phase === "onsite") L.push("Statut : sur place, l'énigme est débloquée. Lieu : " + st.nom + " (" + st.lieu + ").");
    else {
      const z = zoneOf(st), d = Math.round(dist(me.pos, [st.lat, st.lng]));
      L.push("Statut : en route. L'équipe est à environ " + d + " m du lieu, direction " + bearingFR(me.pos, [st.lat, st.lng]) + ". Lieu à trouver, à garder secret : " + st.lieu + ". Une zone de recherche de " + z.r + " m de rayon est affichée sur leur carte.");
    }
    L.push("Indice d'itinéraire donné à l'équipe : « " + st.itineraire + " »");
    if (me.phase === "onsite") L.push("Énigme : « " + st.question + " »");
    const rev = me.revealed[st.id] || 0;
    if (rev) L.push("Indices déjà achetés par l'équipe : " + st.indices.slice(0, rev).map(i => "« " + i.t + " »").join(" ; "));
    if (me.phase === "onsite" && st.indices.length > rev) L.push("Indices payants pas encore achetés (ne les recopie pas ; inspire-t'en pour orienter la réflexion sans les donner) : " + st.indices.slice(rev).map(i => "« " + i.t + " »").join(" ; "));
    if (st.ia) L.push("Note de l'organisateur pour toi : « " + st.ia + " »");
  }
  if (history.length){
    L.push("", "Échanges précédents :");
    history.forEach(m => L.push((m.who === "team" ? "Équipe" : "Maître du jeu") + " : " + m.text));
  }
  L.push("", "Nouveau message de l'équipe : « " + q + " »", "", "Écris uniquement ta réponse à l'équipe.");
  return L.join("\n");
}
async function askMJ(q){
  const me = myTeam(); q = (q || "").trim();
  if (!me || !q || chatBusy) return;
  const history = me.chat.filter(m => !m.sys && m.text).slice(-6);
  me.chat.push({ who:"team", text:q, t:S.t });
  feed(me, "ask", me.name + " → Maître du jeu : « " + q + " »");
  const bubble = { who:"mj", text:"", t:S.t, pending:true };
  me.chat.push(bubble);
  chatBusy = true; renderChat();
  const sample = await samplePromise;
  if (!sample){
    bubble.pending = false; bubble.sys = true; bubble.text = HOSTED ? HOSTED_AI : errCopy("not_granted");
    ui.aiOff = true; chatBusy = false; renderChat(); return;
  }
  chatCtl = new AbortController();
  try {
    const res = await sample(buildPrompt(me, q, history), { modelTier:"quick", cache:false, signal:chatCtl.signal,
      onText: ({ text }) => { bubble.text = text; bubble.pending = false; renderChatBubbles(); } });
    bubble.text = res.text;
  } catch (e){
    const code = e && e.code;
    if (code === "cancelled") bubble.text = (e.text || "") || "(réponse interrompue)";
    else { bubble.text = errCopy(code); bubble.sys = true; if (PERMANENT.has(code)) ui.aiOff = true; }
  } finally {
    bubble.pending = false; chatBusy = false; chatCtl = null;
    renderChat(); save();
    if (ui.sheet && ui.sheet.type === "team" && ui.sheet.id === me.id) renderSheetLive();
  }
}
function renderChatBubbles(){

  if (p.mode === "move"){
    const st = S.steps[p.i]; if (!st) return;
    st.lat = +lat.toFixed(5); st.lng = +lng.toFixed(5); st.leg = [];
    if (S.steps[p.i + 1]) S.steps[p.i + 1].leg = [];
    stepsChanged(); openStep(p.i); toast("Étape déplacée.");
    return;
  }
  const n = S.steps.length + 1;
  const code = Math.random().toString(36).slice(2, 6);
  S.steps.push({ id:"n" + Date.now().toString(36), nom:"Nouvelle étape", lieu:"À préciser", arr:"", lat:+lat.toFixed(5), lng:+lng.toFixed(5), rayon:70, points:20, balise:code, leg:[],
    itineraire:"", question:"", reponses:[], indices:[], ia:"" });
  stepsChanged();
  openStep(n - 1, true);
  toast("Étape ajoutée. Complétez-la ou demandez une suggestion à l'IA.");
}
let aiCtl = null;
async function suggestRiddle(i){
  const st = S.steps[i], status = $("s-ai-status"), btn = $("s-ai");
  if (!st || !status) return;
  if (aiCtl){ aiCtl.abort(); return; }
  const sample = await samplePromise;
  if (!sample){ status.textContent = "L'IA n'est pas disponible dans cette vue."; return; }
  const nom = ($("f-nom").value || st.nom).trim(), lieu = ($("f-lieu").value || st.lieu).trim();
  const prompt = [
    "Tu prépares une étape d'un grand jeu de piste à pied dans Paris, pour des équipes d'adultes.",
    "Lieu : « " + nom + " »" + (lieu && lieu !== "À préciser" ? " (" + lieu + ")" : "") + ", coordonnées " + st.lat.toFixed(5) + ", " + st.lng.toFixed(5) + ".",
    "Propose une étape avec :",
    "- itineraire : 1 à 2 phrases pour trouver le lieu sans le nommer.",
    "- question : une énigme qui se résout en observant le lieu ou grâce à un fait historique vérifiable, en 1 à 3 phrases.",
    "- reponses : la réponse attendue et 1 à 3 variantes acceptables, courtes.",
    "- indices : deux indices, du plus léger au plus fort, sans donner la réponse.",
    "- note_ia : 1 à 2 phrases de contexte factuel pour le maître du jeu, sans la réponse.",
    "N'invente aucun fait. Si tu n'es pas sûr d'un détail, choisis une autre question.",
    'Réponds uniquement avec un objet JSON de la forme {"itineraire":"…","question":"…","reponses":["…"],"indices":["…","…"],"note_ia":"…"}.'
  ].join("\n");
  aiCtl = new AbortController();
  btn.textContent = "Arrêter"; status.textContent = "Claude prépare une proposition (jusqu'à une minute)…";
  try {
    const r = await sample.json(prompt, { modelTier:"default", signal:aiCtl.signal });
    const str = x => typeof x === "string" ? x.trim() : "";
    if (!r || typeof r !== "object") throw { code:"invalid_json" };
    if ($("f-iti") && str(r.itineraire)) $("f-iti").value = str(r.itineraire);
    if ($("f-q") && str(r.question)) $("f-q").value = str(r.question);
    if ($("f-rep") && Array.isArray(r.reponses)) $("f-rep").value = r.reponses.map(str).filter(Boolean).join(", ");
    if (Array.isArray(r.indices)){ if ($("f-i1")) $("f-i1").value = str(r.indices[0]); if ($("f-i2")) $("f-i2").value = str(r.indices[1]); }
    if ($("f-ia") && str(r.note_ia)) $("f-ia").value = str(r.note_ia);
    status.textContent = "Proposition insérée dans le formulaire. Relisez, vérifiez, puis enregistrez.";
  } catch (e){
    const code = e && e.code;
    status.textContent = code === "cancelled" ? "Suggestion annulée." : code === "invalid_json" ? "La proposition était illisible. Réessayez." : errCopy(code);
  } finally {
    aiCtl = null; if ($("s-ai")) $("s-ai").textContent = "Suggérer une énigme";
  }
}
function drawQR(el, text, size){
  if (!el) return;
  el.innerHTML = "";
  if (!window.QRCode){ el.innerHTML = '<p class="hint" style="color:#333">Impossible de générer le QR code ici.</p>'; return; }
  try { new window.QRCode(el, { text, width:size, height:size, colorDark:"#15202B", colorLight:"#FFFFFF", correctLevel:window.QRCode.CorrectLevel.M }); }
  catch (e){ el.innerHTML = '<p class="hint" style="color:#333">Impossible de générer le QR code ici.</p>'; }
}
function openQR(){
  ui.sheet = { type:"qr" }; ui.selected = null;
  const sh = $("sheet"); sh.hidden = false;
  sh.innerHTML = sheetShell("QR d'inscription", "À imprimer au point de départ");
  $("sheet-close").onclick = closeSheet;
  const url = LINK_BASE ? LINK_BASE + "#inscription" : "";
  $("sheet-body").innerHTML = url
    ? '<div class="qr-card" id="qr-main"></div><div class="url-box"><code id="qr-url">' + esc(url) + '</code><button class="btn btn--sm" id="qr-copy">Copier</button></div>' +
      '<p>Chaque équipe scanne ce code avec l\'appareil photo de son téléphone et arrive directement sur l\'inscription, puis sur sa première destination.</p>' +
      '<p class="hint">Pour l\'imprimer : faites une capture d\'écran. Dans cette démo, chaque téléphone joue de son côté avec les équipes simulées ; dans l\'app finale, toutes les équipes remonteront sur votre régie.</p>'
    : '<p>Le QR code d\'inscription apparaîtra ici une fois la démo publiée.</p>';
  if (url){
    drawQR($("qr-main"), url, 240);
    $("qr-copy").onclick = () => {
      const done = () => toast("Lien copié.");
      try { navigator.clipboard.writeText(url).then(done, () => selectText($("qr-url"))); } catch (e){ selectText($("qr-url")); }
    };
  }
}
function selectText(el){ try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Lien sélectionné : copiez-le."); } catch (e){} }

/* ---------- Navigation ---------- */
function setView(v, fromHash){
  ui.view = v;
  $("view-regie").hidden = v !== "regie";
  $("view-joueur").hidden = v !== "joueur";
  $("v-regie").setAttribute("aria-selected", v === "regie");
  $("v-joueur").setAttribute("aria-selected", v === "joueur");
  if (!fromHash){ try { history.replaceState(null, "", "#" + v); } catch (e){} }
  if (v === "regie"){ initRegieMap(); if (regie.ctx) setTimeout(() => regie.ctx.map.invalidateSize(), 0); }
  else { initPlayerMap(); if (player.ctx) setTimeout(() => { player.ctx.map.invalidateSize(); focusPlayer(); }, 0); renderPlayer(); }
  updateMarkers(); renderLive(true);
}
function setTab(tab){
  ui.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  ["equipes","fil","parcours","diffusion"].forEach(t => { $("tab-" + t).hidden = t !== tab; });
  if (tab === "parcours") renderParcours();
  if (tab === "diffusion") renderDiffusion();
  if (tab === "fil"){ dirty.lists = true; }
  renderLive(true);
}
function route(){
  const h = (location.hash || "").replace(/^#/, "");
  if (h.indexOf("balise-") === 0){ setView("joueur", true); handleBalise(h.slice(7)); return; }
  if (h === "joueur" || h === "inscription") setView("joueur", true);
  else setView("regie", true);
}

/* ---------- Sauvegarde ---------- */
const LS_KEY = "pgj-demo-v1";
function snapshot(){
  return { t:S.t, speed:S.speed, paused:S.paused, steps:S.steps, me:myTeam(), myFeed:S.feed.filter(f => f.team === S.meId || f.kind === "mj"),
    broadcasts:S.broadcasts, dismissed:Array.from(dismissed), seq:S.seq, demoNote:ui.demoNote };
}
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); } catch (e){} }
function loadSaved(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e){ return null; } }
function build(data){
  S = newState(); legCache = new Map(); dismissed.clear();
  const target = data && typeof data.t === "number" ? data.t : 38 * 60;
  if (data && Array.isArray(data.steps) && data.steps.length) S.steps = data.steps;
  S.teams = SIMS.map(makeSim);
  advance(target);
  if (data){
    S.speed = [1,10,30].includes(data.speed) ? data.speed : 10;
    S.paused = !!data.paused;
    S.seq = Math.max(S.seq, data.seq || 0);
    (data.broadcasts || []).forEach(b => S.broadcasts.push(b));
    (data.dismissed || []).forEach(k => dismissed.add(k));
    if (data.demoNote === false) ui.demoNote = false;
    if (data.me && data.me.id){
      const me = data.me; me.sim = false;
      me.msgs = me.msgs || []; me.chat = (me.chat || []).filter(m => !m.pending); me.revealed = me.revealed || {}; me.trail = me.trail || [me.pos];
      S.teams.push(me); S.meId = me.id;
    }
    const seen = new Set(S.feed.map(f => f.id));
    (data.myFeed || []).forEach(f => { if (!seen.has(f.id)) S.feed.push(f); });
    S.feed.sort((a, b) => b.t - a.t);
  }
}
function resetDemo(){
  try { localStorage.removeItem(LS_KEY); } catch (e){}
  regie.teamMk.forEach(m => m.remove()); regie.teamMk.clear();
  if (player.meMk){ player.meMk.remove(); player.meMk = null; }
  ui.demoNote = true; ui.sheet = null; ui.selected = null; ui.placing = null; ui.aiOff = false;
  build(null);
  closeSheet(); drawStepMarkers(); drawPlayerMap(); syncSpeed();
  renderParcours(); renderDiffusion(); renderPlayer(); renderLive(true);
  toast("Démo réinitialisée.");
}
function syncSpeed(){
  document.querySelectorAll("#speed button").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.speed) === S.speed));
  $("pause").textContent = S.paused ? "Reprendre" : "Pause";
}

/* ---------- Démarrage ---------- */
function start(hotData){
  const data = hotData && typeof hotData.t === "number" ? hotData : loadSaved();
  build(data);
  if (!window.L){
    ["map-regie","map-joueur"].forEach(id => { $(id).innerHTML = '<div class="map-error">La carte n\'a pas pu se charger. Vérifiez la connexion puis rouvrez la page.</div>'; });
  }

  document.querySelectorAll(".switch button").forEach(b => b.onclick = () => setView(b.dataset.view));
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  document.querySelectorAll("#speed button").forEach(b => b.onclick = () => { S.speed = Number(b.dataset.speed); syncSpeed(); save(); });
  $("pause").onclick = () => {
    S.paused = !S.paused; syncSpeed();
    feed(null, "mj", S.paused ? "Régie : partie mise en pause" : "Régie : reprise de la partie");
    renderPlayer(); renderLive(true); save();
  };
  $("qr-open").onclick = openQR;
  $("panel").addEventListener("click", e => {
    const t = e.target.closest("[data-team]"); if (t){ openTeam(t.dataset.team); return; }
    const s = e.target.closest("[data-step]"); if (s){ openStep(Number(s.dataset.step)); return; }
    const f = e.target.closest("[data-filter]"); if (f){ ui.feedFilter = f.dataset.filter; renderFeed(); return; }
    const g = e.target.closest("[data-go]"); if (g){ setView(g.dataset.go); return; }
    if (e.target.closest("[data-hide-note]")){ ui.demoNote = false; renderTeams(); save(); }
  });
  $("mj-open").onclick = () => { $("chat").hidden = false; $("mj-open").hidden = true; renderChat(); setTimeout(() => $("chat-input").focus(), 50); };
  $("chat-close").onclick = () => { $("chat").hidden = true; $("mj-open").hidden = !myTeam() || myTeam().phase === "done"; };
  $("chat-form").addEventListener("submit", e => { e.preventDefault(); const v = $("chat-input").value; $("chat-input").value = ""; askMJ(v); });
  window.addEventListener("hashchange", route);
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyleAll);
    new MutationObserver(restyleAll).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
  } catch (e){}

  if (HOSTED) $("chat-sub").textContent = "IA · en pause dans cette version";
  syncSpeed();
  route();
  renderParcours(); renderDiffusion();

  let last = performance.now(), n = 0;
  setInterval(() => {
    const now = performance.now(), real = Math.min(2, (now - last)/1000); last = now;
    if (!S.paused) advance(real * S.speed);
    updateMarkers();
    if (++n % 4 === 0) renderLive();
    if (n % 40 === 0) save();
  }, 250);
}

try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => S ? snapshot() : null); } catch (e){}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === "function") hot.ready(start);
else start(hot && hot.data ? hot.data : null);
})();
</script>
