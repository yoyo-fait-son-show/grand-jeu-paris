/* Layout: a régie console. The live map is the stage, the control panel sits beside it;
   the player side is one phone-width column. Identity: Paris street-plaque enamel,
   zinc roofs, Wallace-fountain green, lantern amber for alerts. */
:root{
  --bg:#E4E8EB; --paper:#F8F9FA; --paper-2:#EEF1F3; --ink:#15202B; --ink-2:#56626F; --line:#CDD4DA;
  --accent:#1D3B78; --accent-ink:#FFFFFF; --accent-soft:#DDE5F4;
  --plaque:#1D3B78; --plaque-ink:#FFFFFF; --plaque-frame:#2C5A4B;
  --ok:#1C6A4F; --ok-soft:#DBEFE5; --warn:#A86400; --warn-soft:#FBEACF; --bad:#B3261E; --bad-soft:#F8DEDB;
  --land:#F5F7F8; --outside:#D3D9DE; --water:#A6C6DF; --arr-line:#B7C1CA; --arr-label:#AAB4BD; --map-label:#66727E;
  --shadow:0 1px 2px rgba(21,32,43,.08),0 8px 22px rgba(21,32,43,.10);
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --paper:#141C25; --paper-2:#1A2430; --ink:#E4E9EE; --ink-2:#98A4B0; --line:#283340;
    --accent:#7FA2EC; --accent-ink:#0C1218; --accent-soft:#1C2A45;
    --plaque:#22478F; --plaque-ink:#FFFFFF; --plaque-frame:#3A7160;
    --ok:#52C095; --ok-soft:#14302A; --warn:#F2A541; --warn-soft:#382811; --bad:#F27D72; --bad-soft:#3A1B19;
    --land:#18212B; --outside:#0E141A; --water:#1C4564; --arr-line:#2C3A48; --arr-label:#33414F; --map-label:#7C8996;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.40);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --paper:#141C25; --paper-2:#1A2430; --ink:#E4E9EE; --ink-2:#98A4B0; --line:#283340;
  --accent:#7FA2EC; --accent-ink:#0C1218; --accent-soft:#1C2A45;
  --plaque:#22478F; --plaque-ink:#FFFFFF; --plaque-frame:#3A7160;
  --ok:#52C095; --ok-soft:#14302A; --warn:#F2A541; --warn-soft:#382811; --bad:#F27D72; --bad-soft:#3A1B19;
  --land:#18212B; --outside:#0E141A; --water:#1C4564; --arr-line:#2C3A48; --arr-label:#33414F; --map-label:#7C8996;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.40);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{display:inline-flex;align-items:center;gap:7px;font:500 13px/1 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live.off{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}

/* Street plaque */
.plaque{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--plaque);color:var(--plaque-ink);
  border:3px solid var(--plaque-frame);border-radius:8px;
  box-shadow:inset 0 0 0 2px var(--plaque),inset 0 0 0 3.5px var(--plaque-ink);
  padding:7px 16px 8px;text-align:center;line-height:1;max-width:100%;
}
.plaque small{font:700 10.5px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.plaque b{font:800 22px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere}
.plaque--sm{padding:5px 12px 6px}
.plaque--sm b{font-size:16px}
.plaque--sm small{font-size:9px}
.plaque--lg b{font-size:clamp(24px,7vw,32px)}

.switch{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:650;cursor:pointer;color:var(--ink-2)}
.switch button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}

/* Buttons, pills, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:650;cursor:pointer;min-height:40px;text-align:center}
.btn:hover{background:var(--paper-2)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn--ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn--ok:hover{background:var(--ok);filter:brightness(1.08)}
.btn--danger{color:var(--bad);border-color:var(--bad)}
.btn--sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn--ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:4px;font:650 11.5px/1 var(--f-body);padding:4px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill--ok{background:var(--ok-soft);color:var(--ok)}
.pill--warn{background:var(--warn-soft);color:var(--warn)}
.pill--bad{background:var(--bad-soft);color:var(--bad)}
.pill--info{background:var(--accent-soft);color:var(--accent)}

.field{display:grid;gap:5px;min-width:0}
.field > label,.label{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;min-height:42px}
textarea.input{resize:vertical;min-height:76px;line-height:1.4}
.input:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}

/* Map frame */
.map-frame{position:relative;isolation:isolate;z-index:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--outside);min-height:0}
.map{position:absolute;inset:0}
.leaflet-container{background:var(--outside);font-family:var(--f-body)}
.leaflet-control-attribution{background:var(--paper)!important;color:var(--ink-2);font-size:10px;padding:1px 6px;border-radius:6px 0 0 0;opacity:.85}
.leaflet-control-attribution a{color:var(--ink-2)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-bar a{background:var(--paper)!important;color:var(--ink)!important;border-bottom-color:var(--line)!important}
.map-overlay{position:absolute;left:10px;top:10px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.map-overlay > *{pointer-events:auto}
.map-note{background:var(--paper);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
.map-note--accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.map-error{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--ink-2)}

.pgj-icon{background:none!important;border:0!important}
.tm{position:relative;width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font:800 12px/1 var(--f-display);cursor:pointer}
.tm-lbl{position:absolute;left:26px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--paper);color:var(--ink);font:650 11.5px/1 var(--f-body);padding:4px 6px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.22);pointer-events:none}
.map.z-lo .tm-lbl{display:none}
.tm.sel .tm-lbl{display:block!important;background:var(--ink);color:var(--bg)}
.tm.alert::before,.tm.me::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--warn);animation:ping 1.6s ease-out infinite}
.tm.me::before{border-color:var(--c)}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.stm{width:24px;height:24px;background:var(--plaque);color:#fff;border:2px solid var(--plaque-frame);border-radius:5px;display:grid;place-items:center;font:800 13px/1 var(--f-display);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
.stm.done{background:var(--ok);border-color:var(--ok)}
.stm.start{background:var(--ink);border-color:var(--ink);color:var(--bg);border-radius:50%}
.mon{display:flex;align-items:center;gap:4px;white-space:nowrap;font:650 11px/1 var(--f-body);color:var(--map-label);pointer-events:none;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.mon i{width:6px;height:6px;border-radius:50%;background:var(--map-label);flex:none}
.mon--parc i{background:var(--ok)}
.mon--gare i{border-radius:1px}
.map.z-lo .mon span{display:none}
.arr-lbl{display:grid;place-items:center;font:800 22px/1 var(--f-display);color:var(--arr-label);pointer-events:none;letter-spacing:.02em}
.map.z-hi .arr-lbl{display:none}
.map.tiles .mon{display:none}
.map.tiles .arr-lbl{color:var(--plaque);opacity:.4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)} }
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}

/* Régie */
.view-regie{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:12px}
.panel{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-height:0;overflow:hidden;position:relative}
.panel-head{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap}
.stat{display:grid;gap:2px}
.stat b{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.stat.warn b{color:var(--warn)}
.simbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:5px 9px;font:500 12.5px/1 var(--f-mono);cursor:pointer;color:var(--ink-2);min-height:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;background:none;padding:10px;font-weight:650;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font:500 11px/1 var(--f-mono);background:var(--paper-2);border-radius:999px;padding:3px 6px;color:var(--ink-2)}
.count--warn{background:var(--warn-soft);color:var(--warn)}
.panel-body{flex:1;min-height:0;overflow:auto}
.demo-note{margin:12px 16px 4px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);display:grid;gap:8px;font-size:13.5px}
.demo-note b{font-weight:700}

.team-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:5px 10px;align-items:center;width:100%;text-align:left;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.team-row:hover{background:var(--paper-2)}
.dot{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 14px/1 var(--f-display);flex:none}
.team-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-meta{grid-column:2/4;display:flex;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.score{font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score small{font-size:11px;color:var(--ink-2)}
.prog{display:inline-flex;gap:2px}
.prog i{width:11px;height:5px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--ok)}
.prog i.cur{background:var(--accent)}

.feed-tools{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.feed-item{display:grid;grid-template-columns:40px 10px minmax(0,1fr);gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}
.feed-time{font:500 12px/1.5 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.feed-dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-2));margin-top:5px}
.feed-text{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;min-width:0}
.feed-text span{min-width:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;color:var(--ink-2);text-align:center;font-size:14px}

.step-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.step-row:hover{background:var(--paper-2)}
.step-num{width:28px;height:28px;background:var(--plaque);color:#fff;border:2px solid var(--plaque-frame);border-radius:5px;display:grid;place-items:center;font:800 15px/1 var(--f-display)}
.step-meta{grid-column:2/4;font-size:12.5px;color:var(--ink-2);display:flex;gap:6px 10px;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.section{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.section h3{font:800 15px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.msg-hist{display:grid;gap:8px}
.msg-hist div{font-size:13.5px;padding:9px 12px;background:var(--paper-2);border-radius:8px;display:grid;gap:3px}
.msg-hist time{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.templates{display:flex;gap:6px;flex-wrap:wrap}
.templates button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.templates button:hover{background:var(--paper-2)}

.sheet{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:10}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-head .grow{flex:1;min-width:0}
.sheet-head h2{font:800 22px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head p{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.sheet-body{flex:1;overflow:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--paper-2);border-radius:8px;padding:9px 11px;display:grid;gap:3px;min-width:0}
.kv span{font-size:11.5px;color:var(--ink-2);font-weight:650}
.kv b{font-weight:700;overflow-wrap:anywhere}
.qr-card{background:#fff;border-radius:10px;padding:14px;justify-self:center;display:grid;place-items:center;border:1px solid var(--line)}
.qr-card img,.qr-card canvas{display:block;max-width:100%;height:auto}
.url-box{display:flex;gap:6px;align-items:center}
.url-box code{flex:1;min-width:0;font:12px/1.4 var(--f-mono);background:var(--paper-2);padding:8px 10px;border-radius:6px;overflow-wrap:anywhere;user-select:all}
.ai-box{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13px;background:var(--accent-soft)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--bad-soft);border-radius:8px;font-size:13.5px}

/* Joueur */
.view-joueur{display:flex;justify-content:center}
.phone{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;gap:10px;position:relative}
.phone > .map-frame{flex:0 0 36%;min-height:190px}
.p-status{display:flex;align-items:center;gap:10px;min-height:40px;flex:none}
.p-status .grow{flex:1;min-width:0}
.p-status .team-name{font-size:15px}
.p-status .sub{font-size:12px;color:var(--ink-2);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.p-score{display:grid;justify-items:end;gap:2px}
.p-score b{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.p-score span{font-size:11px;color:var(--ink-2);font-weight:650}
.p-scroll{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding-bottom:76px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card > .plaque{justify-self:start}
.card p{max-width:62ch}
.lead{font-size:15.5px}
.quote{font-size:16px;line-height:1.5}
.eyebrow{font:800 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.status-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.compass{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
.answer-row{display:flex;gap:8px}
.answer-row .input{flex:1;min-width:0}
.hints{display:grid;gap:8px}
.hint-item{font-size:14px;padding:9px 12px;border-radius:8px;background:var(--warn-soft);display:grid;gap:2px}
.hint-item span{font-size:11.5px;font-weight:700;color:var(--warn)}
.feedback{font-size:13.5px;font-weight:650}
.feedback.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.notice{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.notice header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.notice header b{font:800 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.notice time{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.notice .x{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:13px;padding:2px 4px}
.trail-plaques{display:flex;gap:6px;flex-wrap:wrap}
.trail-plaques .step-num{width:30px;height:30px;font-size:15px}
.trail-plaques .step-num.done{background:var(--ok);border-color:var(--ok)}
.trail-plaques .step-num.todo{background:var(--paper-2);color:var(--ink-2);border-color:var(--line)}
.mj-fab{position:absolute;right:0;bottom:8px;z-index:15;box-shadow:var(--shadow);border-radius:999px;padding-inline:18px}
.chat{position:absolute;left:0;right:0;bottom:0;height:min(78%,560px);background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-log{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:grid;gap:10px;align-content:start}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg--team{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg--mj{justify-self:start;background:var(--paper-2);border-bottom-left-radius:4px}
.msg--sys{justify-self:center;background:var(--warn-soft);font-size:13px}
.msg.pending{color:var(--ink-2);font-style:italic}
.chat-suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chat-form{display:flex;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line)}
.chat-form .input{flex:1;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:14px;z-index:1000;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

@media (max-width:860px){
  .view-regie{grid-template-columns:1fr;grid-template-rows:minmax(200px,40%) minmax(0,1fr)}
}
@media (max-width:520px){
  .switch button{padding:6px 11px}
  .stat b{font-size:22px}
  .clock .t-plus{display:none}
}
@media (prefers-reduced-motion:reduce){
  .tm.alert::before,.tm.me::before{animation:none;opacity:.8;transform:scale(1.1)}
  .shake{animation:none}
}


/* --- App réelle --- */
.map.tiles .mon{display:none}
.map.tiles .arr-lbl{color:var(--plaque);opacity:.4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)} }
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.conn{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 var(--f-body);color:var(--ink-2)}
.center-view{display:grid;place-items:center;overflow:auto;padding-block:12px}
.center-card{width:100%;max-width:440px}
.status-seg button[data-st="open"][aria-pressed="true"]{background:var(--ok);color:var(--paper)}
.status-seg button[data-st="paused"][aria-pressed="true"]{background:var(--warn);color:var(--paper)}
.status-seg button[data-st="finished"][aria-pressed="true"]{background:var(--bad);color:var(--paper)}
.status-seg button{font-family:var(--f-body);font-weight:650}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 11px/1 var(--f-body)}
.tm.off{opacity:.45;filter:grayscale(.6)}
.thread{display:grid;gap:8px;max-height:320px;overflow:auto;padding:4px 2px}
.thread .msg{max-width:92%}
.msg time{display:block;font:500 11px var(--f-mono);opacity:.75;margin-bottom:2px}
.q-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;width:100%;text-align:left;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.q-row:hover{background:var(--paper-2)}
.q-row p{grid-column:2;font-size:14px;overflow-wrap:anywhere}
.q-row .meta{grid-column:2;font-size:12px;color:var(--ink-2)}
.mini-actions{display:inline-flex;gap:6px}
.code-box{font:500 20px/1 var(--f-mono);letter-spacing:.06em}
.err{color:var(--bad);font-size:13.5px;font-weight:650}
.gps-big{width:100%;min-height:52px;font-size:16px}
.chat-foot{padding:0 16px 12px;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkish{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
#print-area{display:none}
@media print{
  @page{margin:12mm}
  body{overflow:visible!important;background:#fff!important;color:#000!important;padding:0!important}
  body > *:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .print-page{page-break-after:always;break-after:page;display:grid;justify-items:center;align-content:start;gap:14px;padding-top:10mm;text-align:center;color:#000;font-family:var(--f-body)}
  .print-page:last-child{page-break-after:auto;break-after:auto}
  .print-page h1{font:800 34px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0}
  .print-page h2{font:800 24px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0}
  .print-page p{margin:0;font-size:14px;max-width:150mm}
  .print-page img{width:110mm!important;height:110mm!important;image-rendering:pixelated}
  .print-small img{width:70mm!important;height:70mm!important}
  .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:10mm 8mm}
  .print-cell{display:grid;justify-items:center;gap:6px;text-align:center;border:1px dashed #999;padding:6mm 4mm;break-inside:avoid}
  .print-cell b{font:800 18px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
  .print-cell span{font:500 12px var(--f-mono)}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="plaque plaque--sm" id="brand"><small>Paris</small><b>Grand Jeu</b></div>
    <div class="seg status-seg" id="status-seg" role="group" aria-label="État de la partie" hidden>
      <button data-st="open" aria-pressed="false">En cours</button>
      <button data-st="paused" aria-pressed="false">Pause</button>
      <button data-st="finished" aria-pressed="false">Terminée</button>
    </div>
    <div class="topbar-right">
      <span class="conn"><span class="live" id="live-dot"></span><span id="conn-txt">…</span></span>
    </div>
  </header>

  <main>
    <section class="view center-view" id="view-msg" hidden><div class="card center-card" id="msg-card"></div></section>

    <section class="view view-regie" id="view-regie" aria-label="Régie" hidden>
      <div class="map-frame">
        <div class="map" id="map-regie"></div>
        <div class="map-overlay" id="regie-overlay"></div>
      </div>
      <aside class="panel" id="panel">
        <div class="panel-head">
          <div class="stats" id="stats"></div>
          <div class="simbar">
            <button class="btn btn--sm btn--primary" id="qr-open">QR d'inscription</button>
            <button class="btn btn--sm" id="fit-all">Voir toutes les équipes</button>
          </div>
        </div>
        <nav class="tabs" role="tablist" aria-label="Régie">
          <button role="tab" data-tab="equipes" aria-selected="true">Équipes <span class="count" id="c-teams">0</span></button>
          <button role="tab" data-tab="questions" aria-selected="false">Questions <span class="count" id="c-q">0</span></button>
          <button role="tab" data-tab="fil" aria-selected="false">Fil</button>
          <button role="tab" data-tab="parcours" aria-selected="false">Parcours</button>
          <button role="tab" data-tab="diffusion" aria-selected="false">Diffusion</button>
        </nav>
        <div class="panel-body" id="tab-equipes"></div>
        <div class="panel-body" id="tab-questions" hidden></div>
        <div class="panel-body" id="tab-fil" hidden></div>
        <div class="panel-body" id="tab-parcours" hidden></div>
        <div class="panel-body" id="tab-diffusion" hidden></div>
        <div class="sheet" id="sheet" hidden></div>
      </aside>
    </section>

    <section class="view view-joueur" id="view-joueur" aria-label="Joueur" hidden>
      <div class="phone">
        <div class="p-status" id="p-status"></div>
        <div class="map-frame">
          <div class="map" id="map-joueur"></div>
          <div class="map-overlay" id="joueur-overlay"></div>
        </div>
        <div class="p-scroll" id="p-scroll"></div>
        <button class="btn btn--primary mj-fab" id="mj-open" hidden>Maître du jeu</button>
        <div class="chat" id="chat" hidden>
          <div class="sheet-head">
            <div class="grow"><h2>Maître du jeu</h2><p>Vos messages arrivent directement chez l'organisateur.</p></div>
            <button class="btn btn--sm" id="chat-close">Fermer</button>
          </div>
          <div class="chat-log" id="chat-log" aria-live="polite"></div>
          <div class="chat-suggest" id="chat-suggest"></div>
          <form class="chat-form" id="chat-form">
            <input class="input" id="chat-input" autocomplete="off" maxlength="300" placeholder="Votre message…" aria-label="Message au Maître du jeu">
            <button class="btn btn--primary" id="chat-send" type="submit">Envoyer</button>
          </form>
          <div class="chat-foot" id="chat-foot"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="print-area"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function(){

  try { r = await fetch(API_URL + "/rest/v1/rpc/" + fn, { method:"POST", headers, body:JSON.stringify(args || {}), cache:"no-store" }); }
  catch (e){ throw { code:"NET", message:String(e && e.message || e) }; }
  const txt = await r.text(); let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e){}
  if (!r.ok){
    const m = (data && (data.message || data.msg)) || ("HTTP " + r.status);
    let code = /^PGJ:/.test(m) ? m.slice(4) : "NET";
    if (r.status === 404 || (data && data.code === "PGRST202")) code = "NO_FN";
    if (r.status === 401) code = "BAD_KEY";
    if (data && data.code === "22P02") code = "EQUIPE_INCONNUE";
    throw { code, message:m, status:r.status };
  }
  return data;
}

/* ================= Cartes ================= */
const ATTR_SIMPLE = "Fond simplifié · Contours : Ville de Paris (ODbL)";
const ATTR_OSM = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Contours : Ville de Paris (ODbL)';
const maps = [];
function mpp(z){ return 156543.03392 * Math.cos(48.8566 * toRad) / Math.pow(2, z); }
function baseMap(elId, center, zoom){
  const map = L.map(elId, { zoomControl:false, minZoom:11, maxZoom:19, zoomSnap:0.5, zoomDelta:0.5,
    maxBounds:[[48.75,2.10],[48.97,2.60]], maxBoundsViscosity:0.8 });
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution(ATTR_OSM);
  L.control.zoom({ position:"bottomright", zoomInTitle:"Zoomer", zoomOutTitle:"Dézoomer" }).addTo(map);
  const polys = MAP.arr.map(a => L.polygon(a[2], { interactive:false, weight:1 }).addTo(map));
  const seine = MAP.seine.map(s => ({ w:s.w, line:L.polyline(s.p, { interactive:false, lineCap:"round", lineJoin:"round" }).addTo(map) }));
  MAP.arr.forEach(a => L.marker(a[3], { interactive:false, keyboard:false,
    icon:L.divIcon({ className:"pgj-icon arr-lbl", html:"<span>" + ordinal(a[0]) + "</span>", iconSize:[44,24], iconAnchor:[22,12] }) }).addTo(map));
  MONUMENTS.forEach(m => L.marker([m[1], m[2]], { interactive:false, keyboard:false,
    icon:L.divIcon({ className:"pgj-icon", html:'<div class="mon mon--' + (m[3] || "mon") + '"><i></i><span>' + esc(m[0]) + "</span></div>", iconSize:[0,0], iconAnchor:[3,3] }) }).addTo(map));
  map.setView(center, zoom);
  const ctx = { map, polys, seine, tiles:true };
  map.getContainer().classList.add("tiles");
  let ok = 0, bad = 0;
  const layer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19 });
  layer.on("tileload", () => { ok++; });
  layer.on("tileerror", () => {
    bad++;
    if (!ok && bad >= 6 && ctx.tiles){
      ctx.tiles = false; layer.remove(); map.getContainer().classList.remove("tiles");
      map.attributionControl.removeAttribution(ATTR_OSM); map.attributionControl.addAttribution(ATTR_SIMPLE);
      styleBase(ctx);
    }
  });
  layer.addTo(map);
  const onZoom = () => {
    const z = map.getZoom(), c = map.getContainer();
    c.classList.toggle("z-lo", z < 14); c.classList.toggle("z-hi", z >= 15.5);
    if (!ctx.tiles) seine.forEach(s => s.line.setStyle({ weight: Math.max(2, s.w / mpp(z)) }));
  };
  map.on("zoomend", onZoom);
  styleBase(ctx); onZoom();
  maps.push(ctx);
  return ctx;
}
function styleBase(ctx){
  if (ctx.tiles){
    ctx.polys.forEach(p => p.setStyle({ color:cssVar("--plaque"), weight:1.5, opacity:.45, dashArray:"5 6", fillOpacity:0 }));
    ctx.seine.forEach(s => s.line.setStyle({ opacity:0 }));
    return;
  }
  ctx.polys.forEach(p => p.setStyle({ color:cssVar("--arr-line"), weight:1, opacity:1, dashArray:null, fillColor:cssVar("--land"), fillOpacity:1 }));
  ctx.seine.forEach(s => s.line.setStyle({ color:cssVar("--water"), opacity:1 }));
  ctx.map.fire("zoomend");
}
const stmIcon = (txt, cls) => L.divIcon({ className:"pgj-icon", iconSize:[24,24], iconAnchor:[12,12], html:'<div class="stm ' + (cls || "") + '">' + txt + "</div>" });
function teamIcon(name, color, cls){
  return L.divIcon({ className:"pgj-icon", iconSize:[24,24], iconAnchor:[12,12],
    html:'<div class="tm ' + cls + '" style="--c:' + esc(color) + '"><span>' + esc(initial(name)) + '</span><span class="tm-lbl">' + esc(name) + "</span></div>" });
}
function drawQR(el, text, size){
  if (!el) return;
  el.innerHTML = "";
  if (!window.QRCode){ el.innerHTML = '<p class="hint" style="color:#333">QR code indisponible.</p>'; return; }
  try { new window.QRCode(el, { text, width:size, height:size, colorDark:"#15202B", colorLight:"#FFFFFF", correctLevel:window.QRCode.CorrectLevel.M }); }
  catch (e){ el.innerHTML = '<p class="hint" style="color:#333">QR code indisponible.</p>'; }
}
function copyText(text, el){
  const sel = () => { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Lien sélectionné : copiez-le."); } catch (e){} };
  try { navigator.clipboard.writeText(text).then(() => toast("Lien copié."), sel); } catch (e){ sel(); }
}

const P = { token:lsGet("pgj-token"), st:null, info:null, gps:"off", watch:null, fix:null, acc:null, lastSent:null, lastSentT:0, lastSyncT:0,
  busy:false, chatOpen:false, pendingBalise:null, ctx:null, lg:null, meMk:null, key:"", seen:Number(lsGet("pgj-seen") || 0),
  dismissed:new Set(JSON.parse(lsGet("pgj-dismissed") || "[]")), wake:null, failing:false, gpsWarned:false,
  defColor:Math.floor(Math.random() * 10) };

function myPos(){
  if (P.fix) return P.fix;
  const t = P.st && P.st.team;
  if (t && t.lat != null) return [t.lat, t.lng];
  const s = (P.st && P.st.start) || (P.info && P.info.start);
  return s ? [s.lat, s.lng] : [48.8579, 2.3470];
}
function initPlayer(){
  showView("view-joueur");
  const h = (location.hash || "").replace(/^#/, "");
  if (h.indexOf("balise-") === 0) P.pendingBalise = h.slice(7);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e){}
  P.ctx = baseMap("map-joueur", [48.8579, 2.3470], 15);
  P.lg = L.layerGroup().addTo(P.ctx.map);
  $("mj-open").onclick = openChat;
  $("chat-close").onclick = closeChat;
  $("chat-form").addEventListener("submit", e => { e.preventDefault(); sendQuestion(); });
  if (P.token && P.pendingBalise){ const b = P.pendingBalise; P.pendingBalise = null; P.lastSyncT = Date.now(); scanBalise(b); }
  else if (P.token) sync(true);
  else loadInfo();
  setInterval(tick, 2000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && P.token){ sync(); if (P.gps === "on") requestWake(); } });
}
async function loadInfo(){
  try { P.info = await rpc("pgj_info"); setConn(true, "En ligne"); }
  catch (e){ setConn(false, "Hors ligne"); if (e.code === "NO_FN" || e.code === "BAD_KEY"){ showMessage('<p class="err">' + esc(errText(e)) + "</p>"); return; } }
  renderPlayer(true);
}
async function sync(force){
  if (!P.token || (P.busy && !force)) return;
  P.busy = true;
  try {
    let st;
    const fresh = P.fix && P.gps === "on";
    if (fresh) st = await rpc("pgj_ping", { p_token:P.token, p_lat:P.fix[0], p_lng:P.fix[1], p_acc:P.acc });
    else st = await rpc("pgj_state", { p_token:P.token });
    if (fresh){ P.lastSent = P.fix.slice(); P.lastSentT = Date.now(); }
    P.lastSyncT = Date.now();
    apply(st);
    if (P.failing){ P.failing = false; }
    setConn(true, "En direct");
  } catch (e){
    if (e.code === "EQUIPE_INCONNUE"){ leaveTeam(true); toast(errText(e), 6000); }
    else { P.failing = true; setConn(false, "Reconnexion…"); P.lastSyncT = Date.now() - 4000; }
  } finally { P.busy = false; }
}
function tick(){
  if (!P.token || P.busy) return;
  const now = Date.now();
  if (P.gps === "on" && P.fix){
    const moved = P.lastSent ? dist(P.lastSent, P.fix) : 1e9;
    if ((moved > 12 && now - P.lastSentT > 3500) || now - P.lastSentT > 15000) return sync();
  }
  if (now - P.lastSyncT > (document.hidden ? 20000 : 8000)) sync();
}
function apply(st){
  const prev = P.st;
  syncClock(st.now);
  P.st = st;
  if (st.arrived){ toast("Vous êtes arrivés. L'énigme est débloquée !"); buzz(); }
  const fromRegie = (st.msgs || []).filter(m => m.from === "regie");
  const fresh = fromRegie.filter(m => m.id > P.seen);
  if (fresh.length && prev){
    buzz();
    if (!P.chatOpen) toast((fresh[fresh.length-1].all ? "Message à tous : " : "Message de l'organisateur : ") + fresh[fresh.length-1].text, 6000);
  }
  if (P.chatOpen && fromRegie.length) markSeen();
  if (prev && prev.status !== st.status){
    toast(st.status === "paused" ? "Partie en pause." : st.status === "finished" ? "Partie terminée !" : "La partie reprend !", 5000); buzz();
  }
  renderPlayer();
  if (P.chatOpen) renderChat();
  if (!prev || prev.team.step !== st.team.step || prev.team.phase !== st.team.phase) focusPlayer();
}
function markSeen(){
  const ids = ((P.st && P.st.msgs) || []).filter(m => m.from === "regie").map(m => m.id);

}

async function register(e){

  if (name.length < 2){ err.textContent = ERRORS.NOM; $("reg-name").focus(); return; }

function toggleGPS(){

  if (P.watch !== null){ navigator.geolocation.clearWatch(P.watch); P.watch = null; P.gps = "off"; releaseWake(); renderPlayer(); return; }
  P.gps = "pending"; renderPlayer(); requestWake();
  P.watch = navigator.geolocation.watchPosition(pos => {
    P.fix = [pos.coords.latitude, pos.coords.longitude]; P.acc = pos.coords.accuracy;
    const first = P.gps !== "on"; P.gps = "on";
    if (first){ toast("GPS activé."); renderPlayer(); focusPlayer(); sync(); }
    else { drawPlayerMap(); renderPlayerLive(); }
  }, err => {
    if (err.code === 1){
      if (P.watch !== null) navigator.geolocation.clearWatch(P.watch);
      P.watch = null; P.gps = "denied"; releaseWake(); renderPlayer();
      toast("Localisation refusée. Autorisez-la dans les réglages du navigateur.", 5000);
    } else if (P.gps !== "on" && !P.gpsWarned){
      P.gpsWarned = true; toast("Signal GPS faible : la recherche continue. Sortez à découvert si possible.", 5000);

}

const R = { code:lsGet("pgj-admin"), snap:null, ctx:null, teamMk:new Map(), stepMk:[], route:null, trail:null, trailTeam:null, trailT:0,
  tab:"equipes", sheet:null, placing:null, preview:null, feedFilter:"tout", seenQ:Number(lsGet("pgj-seenq") || 0), timer:null,

function initRegie(){

async function adminLogin(msg){

  catch (e){ showMessage('<div class="plaque plaque--lg"><small>Régie</small><b>Connexion</b></div><p class="err">' + esc(errText(e)) + '</p><button class="btn" id="retry">Réessayer</button>'); $("retry").onclick = () => adminLogin(); return; }

  showMessage('<form id="login-form" style="display:grid;gap:14px">' +
    '<div class="plaque plaque--lg"><small>Régie</small><b>' + (first ? "Premier accès" : "Connexion") + "</b></div>" +
    (first ? '<p class="lead">Choisissez le code secret de la régie. Lui seul donne accès aux équipes, aux réponses et aux réglages.</p>' : '<p class="lead">Entrez le code de la régie.</p>') +
    '<div class="field"><label for="code">' + (first ? "Nouveau code (6 caractères minimum)" : "Code régie") + '</label><input class="input code-box" id="code" type="password" autocomplete="' + (first ? "new-password" : "current-password") + '" minlength="6" required></div>' +
    (first ? '<div class="field"><label for="code2">Confirmez le code</label><input class="input code-box" id="code2" type="password" autocomplete="new-password" required></div>' : "") +
    '<button class="btn btn--primary" type="submit" id="login-btn">' + (first ? "Créer le code et ouvrir la régie" : "Ouvrir la régie") + "</button>" +
    '<div class="err" id="login-err" aria-live="polite">' + esc(msg || "") + "</div>" +
    '<p class="hint">' + (first ? "Notez-le bien : il ne pourra pas être retrouvé, seulement changé depuis la régie." : "Les joueurs n'ont pas besoin de code : ils s'inscrivent avec le QR code.") + "</p></form>");
  $("code").focus();
  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const code = $("code").value, err = $("login-err"), btn = $("login-btn");
    if (first && code !== $("code2").value){ err.textContent = "Les deux codes ne sont pas identiques."; return; }
    btn.disabled = true; err.textContent = "";
    try {
      if (first) await rpc("pgj_admin_init", { p_code:code }); else await rpc("pgj_admin_check", { p_code:code });
      R.code = code; lsSet("pgj-admin", code); startRegie();
    } catch (ex){ err.textContent = errText(ex); btn.disabled = false; }
  });
}
function logoutRegie(msg){
  lsDel("pgj-admin"); R.code = null; clearTimeout(R.timer); R.snap = null;
  $("status-seg").hidden = true;
  adminLogin(msg);
}
function startRegie(){
  showView("view-regie");
  $("status-seg").hidden = false;
  if (!R.ctx){
    R.ctx = baseMap("map-regie", [48.8622, 2.3398], window.innerWidth > 860 ? 14.5 : 14);
    R.ctx.map.on("click", e => { if (R.placing) placeAt(e.latlng.lat, e.latlng.lng); });
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
    document.querySelectorAll("#status-seg button").forEach(b => b.onclick = () => setStatus(b.dataset.st));
    $("qr-open").onclick = openQR;
    $("fit-all").onclick = fitAll;
    $("panel").addEventListener("click", e => {
      const t = e.target.closest("[data-team]"); if (t){ openTeam(t.dataset.team); return; }
      const s = e.target.closest("[data-step]"); if (s){ openStep(s.dataset.step); return; }
      const f = e.target.closest("[data-filter]"); if (f){ R.feedFilter = f.dataset.filter; R.lastFeedId = -1; renderFeed(); }
    });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  }
  setTimeout(() => R.ctx.map.invalidateSize(), 0);

}
async function poll(){
  clearTimeout(R.timer);
  if (!R.code) return;
  if (R.busy){ R.timer = setTimeout(poll, 1000); return; }
  R.busy = true;
  try {
    const s = await rpc("pgj_admin_snapshot", { p_code:R.code });
    syncClock(s.now);
    const first = !R.snap;
    R.snap = s; R.failing = false;
    setConn(true, "En direct · " + hhmm(s.now));
    renderRegie(first);
  } catch (e){
    if (e.code === "CODE"){ R.busy = false; logoutRegie("Le code régie a changé : reconnectez-vous."); return; }
    R.failing = true; setConn(false, e.code === "NO_FN" ? "Base non installée" : "Reconnexion…");
    if (e.code === "NO_FN") toast(errText(e), 6000);
  } finally { R.busy = false; }
  R.timer = setTimeout(poll, document.hidden ? 15000 : 4000);
}
async function act(fn, args, okMsg){
  try { const r = await rpc(fn, Object.assign({ p_code:R.code }, args)); if (okMsg) toast(okMsg); poll(); return r || true; }
  catch (e){ if (e.code === "CODE") logoutRegie(errText(e)); else toast(errText(e), 5000); return null; }
}
function teamById(id){ return R.snap && R.snap.teams.find(t => t.id === id); }
function stepIndex(id){ return R.snap ? R.snap.steps.findIndex(s => s.id === id) : -1; }
function isOffline(t){ return minsSince(t.last_seen) >= 3; }
function isBlocked(t){ return t.phase === "onsite" && t.arrived_at && minsSince(t.arrived_at) >= 10; }
function teamStatus(t){
  if (t.phase === "done") return { txt:"Terminé", cls:"ok" };
  if (isOffline(t)) return { txt:"Hors ligne " + minsSince(t.last_seen) + " min", cls:"bad" };
  if (isBlocked(t)) return { txt:"Bloquée " + minsSince(t.arrived_at) + " min", cls:"warn" };
  if (t.phase === "onsite") return { txt:"Sur place", cls:"info" };
  return { txt:"En route", cls:"" };
}
function ranking(){
  return R.snap.teams.slice().sort((a, b) => (b.step - a.step) || (b.score - a.score) || ((Date.parse(a.done_at) || 9e15) - (Date.parse(b.done_at) || 9e15)));
}
function pendingQuestions(){
  const out = [];
  if (!R.snap) return out;
  R.snap.teams.forEach(t => {
    const ms = R.snap.msgs.filter(m => m.team === t.id);
    const lastTeam = ms.filter(m => m.from === "team").pop();
    const lastRegie = ms.filter(m => m.from === "regie").pop();
    if (lastTeam && (!lastRegie || lastRegie.id < lastTeam.id)) out.push({ team:t, msg:lastTeam, n:ms.filter(m => m.from === "team" && (!lastRegie || m.id > lastRegie.id)).length });
  });
  return out.sort((a, b) => a.msg.id - b.msg.id);
}
function renderRegie(first){
  const s = R.snap;

  // nouvelles questions
  const newQ = s.msgs.filter(m => m.from === "team" && m.id > R.seenQ);
  if (newQ.length){
    if (!first){ const t = teamById(newQ[newQ.length-1].team); toast("Question de " + (t ? t.name : "?") + " : " + newQ[newQ.length-1].text, 6000); buzz(); }
    R.seenQ = Math.max(...newQ.map(m => m.id)); lsSet("pgj-seenq", String(R.seenQ));
  }
  const pq = pendingQuestions();
  document.title = (pq.length ? "(" + pq.length + ") " : "") + "Régie · Paris Grand Jeu";
  renderStats(pq);
  if (R.tab === "equipes") renderTeams();
  if (R.tab === "questions") renderQuestions(pq);
  if (R.tab === "fil") renderFeed();
  if (R.tab === "parcours") renderParcours();

function renderBroadcastHistory(){

function setTab(tab){
  R.tab = tab;

async function setStatus(st){
  if (!R.snap || R.snap.game.status === st) return;
  await act("pgj_admin_game", { p_patch:{ status:st } }, st === "open" ? "Partie en cours." : st === "paused" ? "Partie en pause : les équipes sont prévenues." : "Partie terminée.");
}

/* --- carte régie --- */
function drawSteps(){
  const s = R.snap, map = R.ctx.map;
  const sig = JSON.stringify([s.game.start_lat, s.game.start_lng, s.steps.map(x => [x.id, x.lat, x.lng, x.nom])]);
  if (sig === R.stepSig) return;
  R.stepSig = sig;
  R.stepMk.forEach(m => m.remove());
  if (R.route) R.route.remove();
  const line = [[s.game.start_lat, s.game.start_lng]].concat(s.steps.map(x => [x.lat, x.lng]));
  R.route = L.polyline(line, { color:cssVar("--accent"), weight:2, dashArray:"4 7", opacity:.6, interactive:false }).addTo(map);
  const start = L.marker([s.game.start_lat, s.game.start_lng], { icon:stmIcon("D", "start"), zIndexOffset:50, title:"Départ : " + s.game.start_name }).addTo(map);
  R.stepMk = [start].concat(s.steps.map((x, i) => {
    const m = L.marker([x.lat, x.lng], { icon:stmIcon(i + 1), zIndexOffset:100, title:x.nom }).addTo(map);
    m.on("click", () => { if (!R.placing) openStep(x.id); });
    return m;
  }));
}
function updateTeamMarkers(){
  const s = R.snap, map = R.ctx.map, seen = new Set();
  s.teams.forEach(t => {
    if (t.lat == null) return;
    seen.add(t.id);
    const cls = (isBlocked(t) && t.phase !== "done" ? "alert " : "") + (isOffline(t) && t.phase !== "done" ? "off " : "") + (R.sheet && R.sheet.type === "team" && R.sheet.id === t.id ? "sel" : "");
    let m = R.teamMk.get(t.id);
    if (!m){
      m = L.marker([t.lat, t.lng], { icon:teamIcon(t.name, t.color, cls), zIndexOffset:600, title:t.name }).addTo(map);
      m.on("click", () => { if (!R.placing) openTeam(t.id); });
      m._cls = cls; m._name = t.name; R.teamMk.set(t.id, m);
    } else {
      m.setLatLng([t.lat, t.lng]);
      if (m._cls !== cls || m._name !== t.name){ m.setIcon(teamIcon(t.name, t.color, cls)); m._cls = cls; m._name = t.name; }
    }
  });
  R.teamMk.forEach((m, id) => { if (!seen.has(id)){ m.remove(); R.teamMk.delete(id); } });
  if (R.trailTeam && R.trail && Date.now() - R.trailT > 20000) loadTrail(R.trailTeam);
}
function fitAll(quiet){
  const s = R.snap; if (!s || !R.ctx) return;
  const pts = s.teams.filter(t => t.lat != null).map(t => [t.lat, t.lng]).concat(s.steps.map(x => [x.lat, x.lng]), [[s.game.start_lat, s.game.start_lng]]);
  if (pts.length) R.ctx.map.fitBounds(L.latLngBounds(pts), { padding:[30,30], maxZoom:16 });
  if (!quiet && !s.teams.some(t => t.lat != null)) toast("Aucune équipe localisée pour l'instant.");
}
async function loadTrail(id){
  R.trailT = Date.now();
  try {
    const pts = await rpc("pgj_admin_trail", { p_code:R.code, p_team:id });
    const t = teamById(id); if (!t || R.trailTeam !== id) return;
    const line = pts.concat(t.lat != null ? [[t.lat, t.lng]] : []);
    if (R.trail) R.trail.setLatLngs(line).setStyle({ color:t.color });
    else R.trail = L.polyline(line, { color:t.color, weight:4, opacity:.85, interactive:false }).addTo(R.ctx.map);
  } catch (e){ toast(errText(e)); }
}
function clearTrail(){ if (R.trail){ R.trail.remove(); R.trail = null; } R.trailTeam = null; }
async function placeAt(lat, lng){
  const p = R.placing; R.placing = null;
  lat = +lat.toFixed(6); lng = +lng.toFixed(6);
  if (p.mode === "start"){
    await act("pgj_admin_game", { p_patch:{ start_lat:lat, start_lng:lng, start_name:R.snap.game.start_name } }, "Départ déplacé.");
    renderParcours(); return;
  }
  if (p.mode === "new"){ openStep(null, { lat, lng }); renderParcours(); return; }
  if (p.mode === "move" && R.sheet && R.sheet.type === "step"){
    $("f-lat").value = lat; $("f-lng").value = lng;
    if (R.preview) R.preview.remove();
    R.preview = L.marker([lat, lng], { icon:stmIcon("●", "start"), zIndexOffset:1000 }).addTo(R.ctx.map);
    $("s-saved").textContent = "Nouvel emplacement choisi. Enregistrez pour confirmer.";
    renderRegie(false);
  }
}

/* --- fiches --- */
function closeSheet(){
  R.sheet = null; $("sheet").hidden = true; $("sheet").innerHTML = "";

  clearTrail();
  if (R.snap) renderRegie(false);
}
function sheetShell(title, sub, color){

    $("t-del-yes").onclick = async () => { if (await act("pgj_admin_team", { p_team:id, p_action:"delete", p_value:0 }, "Équipe supprimée.")) closeSheet(); };

function renderTeamLive(){
  const id = R.sheet && R.sheet.id, t = teamById(id);
  if (!t){ closeSheet(); return; }
  const st = teamStatus(t), step = R.snap.steps[t.step];
  $("t-live").innerHTML = '<div class="kv">' +
    '<div><span>Statut</span><b><span class="pill ' + (st.cls ? "pill--" + st.cls : "") + '">' + st.txt + "</span></b></div>" +
    '<div><span>Score</span><b class="score">' + t.score + " pts</b></div>" +
    '<div><span>Étape</span><b>' + (t.phase === "done" ? "Terminé" : (t.step + 1) + (step ? " · " + esc(step.nom) : "")) + "</b></div>" +

    '<div><span>Indices pris</span><b>' + t.hints_taken + "</b></div>" +
    '<div><span>Mauvaises réponses</span><b>' + t.wrongs + "</b></div>" +
    '<div><span>Position</span><b>' + (t.pos_at ? ago(t.pos_at) + (t.acc ? " · ±" + Math.round(t.acc) + " m" : "") : "pas encore de GPS") + "</b></div>" +

  const key = t.phase + t.step;
  if ($("t-actions").dataset.key !== key){
    $("t-actions").dataset.key = key;
    $("t-actions").innerHTML = acts.join("");
    $("t-actions").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      const a = b.dataset.act;
      await act("pgj_admin_team", { p_team:id, p_action:a === "plus" || a === "minus" ? "points" : a, p_value:a === "plus" ? 5 : a === "minus" ? -5 : 0 },
        { unlock:"Énigme débloquée.", validate:"Étape validée.", plus:"+5 points.", minus:"−5 points." }[a]);
      b.disabled = false;

  }
  const ms = R.snap.msgs.filter(m => m.team === id || (m.team === null && Date.parse(m.t) >= Date.parse(t.created_at)));

      : '<p class="hint">Pas encore de message. Écrivez à l\'équipe ci-dessous.</p>';
    th.scrollTop = th.scrollHeight;
  }
}
function openStep(id, at){
  const s = id ? R.snap.steps.find(x => x.id === id) : null;
  if (id && !s) return;
  clearTrail();
  const isNew = !s, i = s ? stepIndex(id) : R.snap.steps.length;
  const st = s || { nom:"", lieu:"", arr:"", lat:at.lat, lng:at.lng, rayon:70, points:20, itineraire:"", question:"", reponses:[], indices:[], note:"", balise:"" };
  R.sheet = { type:"step", id:id || null };
  const sh = $("sheet"); sh.hidden = false;
  sh.innerHTML = sheetShell((isNew ? "Nouvelle étape " : "Étape ") + (i + 1), isNew ? "Pas encore enregistrée" : st.lieu + (st.arr ? " · " + st.arr : ""));
  $("sheet-close").onclick = closeSheet;
  const v = x => esc(x == null ? "" : x);

  $("sheet-body").innerHTML =
    '<div class="row"><button class="btn btn--sm" id="s-center" type="button">Voir sur la carte</button><button class="btn btn--sm" id="s-move" type="button">Déplacer sur la carte</button>' +

    '<form id="step-form" style="display:grid;gap:12px">' +

      '<div class="grid2"><div class="field"><label for="f-note">Note pour le Maître du jeu</label><textarea class="input" id="f-note" maxlength="600" placeholder="Contexte utile pour aider les équipes. Servira aussi à l\'IA plus tard.">' + v(st.note) + '</textarea></div><div class="field"><label for="f-pts">Points</label><input class="input" id="f-pts" inputmode="numeric" maxlength="3" value="' + v(st.points) + '"><label for="f-r">Rayon (m)</label><input class="input" id="f-r" inputmode="numeric" maxlength="3" value="' + v(st.rayon) + '"></div></div>' +
      '<div class="row"><button class="btn btn--primary" type="submit" id="s-save">' + (isNew ? "Créer l'étape" : "Enregistrer") + '</button><span class="hint" id="s-saved"></span></div>' +
    "</form>" +
    (qrUrl ? '<div class="field"><span class="label">Balise QR de l\'étape</span><div class="qr-card" id="s-qr"></div><div class="url-box"><code id="s-url">' + esc(qrUrl) + '</code></div><p class="hint">À coller discrètement sur place : la scanner débloque l\'énigme, même sans GPS.</p></div>' : "") +
    (isNew ? "" : '<div id="s-del-box" class="row"><button class="btn btn--sm btn--danger" id="s-del" type="button"' + (R.snap.steps.length <= 1 ? " disabled" : "") + ">Supprimer l'étape</button></div>");
  if (qrUrl) drawQR($("s-qr"), qrUrl, 180);

  if (!isNew){
    $("s-up").onclick = async () => { if (await act("pgj_admin_step_move", { p_id:id, p_dir:-1 })) setTimeout(() => openStep(id), 600); };

    if (r){
      if (R.preview){ R.preview.remove(); R.preview = null; }
      R.stepSig = "";
      if (isNew) setTimeout(() => openStep(r.id), 700);
      else $("s-saved").textContent = "Enregistré à " + hhmm(new Date().toISOString()) + ".";
    }
  });
}
function openQR(){
  clearTrail();
  R.sheet = { type:"qr" };
  const sh = $("sheet"); sh.hidden = false;
  sh.innerHTML = sheetShell("QR d'inscription", "À afficher ou imprimer au point de départ");
  $("sheet-close").onclick = closeSheet;
  const url = BASE_URL + "#inscription";
  $("sheet-body").innerHTML = '<div class="qr-card" id="qr-main"></div><div class="url-box"><code id="qr-url">' + esc(url) + '</code><button class="btn btn--sm" id="qr-copy">Copier</button></div>' +
    "<p>Chaque équipe scanne ce code avec l'appareil photo de son téléphone, s'inscrit et reçoit aussitôt sa première destination. Elle apparaît alors sur votre carte.</p>" +
    '<div class="row"><button class="btn btn--primary" id="qr-print">Imprimer les QR codes</button></div>' +
    '<p class="hint">L\'impression contient le QR d\'inscription et une balise par étape, à coller sur place.</p>';
  drawQR($("qr-main"), url, 240);
  $("qr-copy").onclick = () => copyText(url, $("qr-url"));
  $("qr-print").onclick = printAll;
}
function printAll(){
  const s = R.snap; if (!s) return;
  const area = $("print-area");
  area.innerHTML = '<section class="print-page"><h1>Grand Jeu de Paris</h1><p>Scannez ce code avec l\'appareil photo de votre téléphone pour inscrire votre équipe.</p><div id="pq-main"></div><p>' + esc(BASE_URL) + "</p></section>" +
    '<section class="print-page print-small"><h2>Balises des étapes</h2><p>Une balise par lieu, à coller discrètement. La scanner débloque l\'énigme sans GPS.</p><div class="print-grid">' +
    s.steps.map((x, i) => '<div class="print-cell"><b>' + (i + 1) + " · " + esc(x.nom) + '</b><div id="pq-' + i + '"></div><span>' + esc(x.lieu) + "</span></div>").join("") + "</div></section>";
  drawQR($("pq-main"), BASE_URL + "#inscription", 512);
  s.steps.forEach((x, i) => drawQR($("pq-" + i), BASE_URL + "#balise-" + x.balise, 320));
  setTimeout(() => { try { window.print(); } catch (e){ toast("Impression impossible sur cet appareil."); } }, 400);
}

/* ================= Démarrage ================= */
function boot(){
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => maps.forEach(styleBase));
  } catch (e){}
  if (!window.L || !MAP){ showMessage('<p class="err">La carte n\'a pas pu se charger. Vérifiez la connexion puis rechargez la page.</p>'); return; }
  if (!CONFIGURED){ setupScreen(); return; }
  const h = (location.hash || "").replace(/^#/, "");
  if (h === "regie") initRegie(); else initPlayer();
  window.addEventListener("hashchange", () => {
    const nh = (location.hash || "").replace(/^#/, "");
    if (nh.indexOf("balise-") === 0 && P.token){ scanBalise(nh.slice(7)); try { history.replaceState(null, "", location.pathname); } catch (e){} }
    else if ((nh === "regie") !== (h === "regie")) location.reload();
  });
}
boot();
})();
</script>
